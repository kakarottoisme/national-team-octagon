-top:12px}.evidence strong{display:block;color:var(--ink);margin:6px 0;font-size:var(--type-body)}.evidence p{margin:0}.coverage{padding-top:12px;color:var(--muted);font-size:var(--type-sec-meta);line-height:var(--type-sec-meta-lh)}.chart{height:330px;width:100%;min-width:0}.tbx{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:750px;text-align:right}th,td{border-bottom:1px solid var(--line);padding:10px 12px;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500}tr:last-child td{border:0}.link-button{padding:4px 8px;min-height:44px;color:var(--accent)}.notice{padding:12px 16px;background:#edf3fc;border:1px solid #ccd5df;border-radius:10px;margin-bottom:12px}.notice[hidden]{display:none}.history-actions{display:flex;justify-content:center;margin-top:12px}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:#1f273366}.dialog{width:min(720px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:12px;padding:16px}.dialog h2{margin:0;color:var(--ink);font-size:var(--type-sec-title)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog dl{display:grid;grid-template-columns:110px 1fr;gap:12px}.dialog dd{margin:0;overflow-wrap:anywhere}.dialog dt{color:var(--muted)}.close{width:44px;min-width:44px;padding:0}.status-pill{display:inline-block;padding:3px 8px;background:#edf3fc;border-radius:8px;color:#325b90}.history-note{margin:0 0 12px;color:var(--muted);font-size:var(--type-sec-meta)}.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}

<header class="top"><div class="wrap shell-head"><div class="brand"><span class="mark" aria-hidden="true"><img src="favicon.svg?v=ui-2" width="38" height="38" alt=""></span><div class="brand-copy"><h1>市场顶底</h1><div class="crumb">A股与美股 · 1–3个月</div></div></div><div class="ctl"><button id="rulesButton" type="button">判断规则</button><button id="rb" type="button">刷新</button></div></div><div class="wrap nav-row"><nav class="view-tabs" aria-label="数据视图导航"><a class="view-tab" href="index.html">资金观察</a><a class="view-tab" href="margin.html">两融余额</a><a class="view-tab" href="futures-preview.html">期指持仓</a><a class="view-tab" href="risk-preview.html">全球风险</a><a class="view-tab" href="market-cycle.html" aria-current="page">市场顶底</a></nav></div></header>
<main class="wrap"><div class="sec sec-first"><h2>当前判断</h2><span class="side" id="st">读取中…</span><div class="section-actions"><button class="chip" data-market="cn" aria-pressed="true">A股</button><button class="chip" data-market="us" aria-pressed="false">美股</button></div></div><div class="notice" id="notice" role="status" hidden></div><div class="panel" id="cycleSummary"><p class="summary">等待真实收盘数据</p></div>
<div class="sec"><h2>关键依据</h2><span class="side">点击指标查看规则与来源</span></div><div class="panel tbx"><table><thead><tr><th>宽基指数</th><th>收盘</th><th>63日涨跌</th><th>距一年高点</th><th>200日乖离</th><th>RSI14</th><th>20日实现波动</th></tr></thead><tbody id="metrics"></tbody></table></div>
<div class="sec"><h2>价格与风险阶段</h2><span class="side">收盘价、20/50/200日线与当时规则阶段</span><div class="section-actions"><label class="sr-only" for="indexSelect">选择指数</label><select id="indexSelect"></select><button class="chip" data-range="126" aria-pressed="false">半年</button><button class="chip" data-range="252" aria-pressed="true">一年</button></div></div><div class="panel"><div class="chart" id="priceChart"></div><div class="chart" id="stateChart" style="height:210px"></div></div>
<div class="sec"><h2>历史信号检验</h2><span class="side">规则重放，不是当年的实盘提醒</span></div><div class="panel"><p class="history-note">21/63交易日后收益与期间最低收益；窗口未满显示 —</p><div class="tbx"><table><thead><tr><th>信号日</th><th>顶部 / 下行阶段</th><th>底部阶段</th><th>21日收益 / 最低</th><th>63日收益 / 最低</th></tr></thead><tbody id="events"></tbody></table></div><div class="history-actions"><button id="moreEvents" aria-expanded="false">展开全部</button></div></div>
</main><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog-head"><h2 id="modalTitle">判断规则</h2><button class="close" id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></section></div>
<script src="https://fastly.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js'"></script><script>
'use strict';const $=id=>document.getElementById(id),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(x,n=2)=>x===null||x===undefined||!Number.isFinite(+x)?'—':(+x).toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n}),pct=x=>num(x)+'%',safe=u=>{try{const v=new URL(u);return /^https?:$/.test(v.protocol)?esc(v.href):''}catch(e){return ''}};
let DATA=null,market='cn',range=252,expanded=false,priceChart=null,stateChart=null,previousFocus=null,busy=false;
function openModal(title,html){previousFocus=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').hidden=false;document.querySelector('main').inert=true;document.querySelector('header').inert=true;$('closeModal').focus()}
function closeModal(){$('modal').hidden=true;document.querySelector('main').inert=false;document.querySelector('header').inert=false;previousFocus?.focus()}
$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if($('modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const items=[...$('modal').querySelectorAll('a[href],button')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('rulesButton').onclick=()=>{if(!DATA)return;openModal('市场顶底 · 判断规则',`<p>价格观察规则 v1，尚未做样本外验证；不输出“见顶/见底概率”，不联动持仓或 IC。</p><dl>${Object.entries(DATA.rules).filter(([k])=>!['validated','version'].includes(k)).map(([k,v])=>`<dt>${esc(({horizon:'观察周期',overheat:'过热',breadth:'宽基共振',top:'顶部',bottom:'底部',downtrend:'下行压力',confirmation:'修复确认',margin:'两融背景',missing:'缺数据',evaluation:'历史检验',coverage:'覆盖范围'})[k]||k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p>思路参考 <a href="${safe(DATA.reference)}" target="_blank" rel="noopener">musaeai</a>；数据取腾讯财经收盘日线，各行点开可查看原始来源。</p>`)};
function indexDetails(code){const m=DATA?.markets[market],f=m?.latest?.indices?.[code];if(!f)return;openModal(f.name+' · '+m.as_of,`<dl><dt>趋势</dt><dd>20日线 ${num(f.ma20)} · 50日线 ${num(f.ma50)} · 200日线 ${num(f.ma200)}</dd><dt>过热</dt><dd>200日乖离 ${pct(f.bias200)}，此前最多756日分位 ${pct(f.bias_pctile)}；63日涨幅 ${pct(f.ret63)}</dd><dt>底部</dt><dd>一年高点回撤 ${pct(f.drawdown)}；63日低点反弹 ${pct(f.rebound)}；RSI14 ${num(f.rsi14)}</dd><dt>实现波动</dt><dd>${pct(f.vol20)}：由过去20日实际收益计算，不是VIX或未来波动预测</dd><dt>数据</dt><dd>腾讯财经 · 行情日 ${esc(m.as_of)} · <a href="${safe(f.source)}" target="_blank" rel="noopener">原始日线</a></dd></dl>`)}
function render(){if(!DATA)return;const m=DATA.markets[market];document.querySelectorAll('[data-market]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.market===market)));$('notice').hidden=m.status==='ok';$('notice').textContent=m.status==='stale'?`本次未取得完整新数据，保留 ${m.as_of} 的旧判断`:`暂不能判断：${m.error||'核心日线缺失'}`;if(!m.latest){$('cycleSummary').innerHTML='<p class="summary">核心数据不足，暂不判断顶底</p>';$('metrics').innerHTML='';$('events').innerHTML='';$('indexSelect').innerHTML='';priceChart?.clear();stateChart?.clear();$('moreEvents').hidden=true;$('st').textContent=m.name+' · 缺数据';return}
const r=m.latest,b=r.breadth,main=r.indices[m.primary];$('st').textContent=`${m.name} · 收盘 ${m.as_of} · 北京时间08:20 / 17:10更新`;const currentAge=Math.floor((Date.now()-Date.parse(m.as_of+'T23:59:59+08:00'))/86400000);if(currentAge>5&&m.status==='ok'){$('notice').hidden=false;$('notice').textContent=`行情停留在 ${m.as_of}，请勿当作当前判断`}
const margin=m.margin;const context=market==='cn'&&margin?`两融 ${esc(margin.as_of)}：${num(margin.balance)}亿元${margin.change20==null?'':'，20个余额记录 '+pct(margin.change20)}${margin.lag_days>5?'（较旧）':''}，仅作背景，不计入判定`:'未纳入估值、信用及期权结构；不能据此确认完整市场顶部或绝对底部';
$('cycleSummary').innerHTML=`<p class="summary">${esc(r.summary)}</p><div class="judgments"><div class="verdict"><div class="label">顶部风险 / 下行阶段</div><div class="vl">${esc(r.top)}</div><div class="meta">${r.top==='顶部风险确认'?'近期过热后，多个宽基回撤且跌破短期趋势':r.top==='中期下行压力'?'下行趋势信号，不是高位过热信号':'看过热累积是否转为价格破位'}</div></div><div class="verdict"><div class="label">底部迹象</div><div class="vl">${esc(r.bottom)}</div><div class="meta">${r.bottom==='底部观察区'?'回撤与弱动量共振，尚不能确认反转':'看超跌后是否站稳均线并改善共振'}</div></div></div><div class="evidence"><div><div class="label">趋势共振</div><strong>${b.above50} / ${b.total} 个宽基站上50日线</strong><p class="meta">${b.falling} 个出现中期下行压力</p></div><div><div class="label">过热与超跌</div><strong>过热 ${b.hot} 个 · 超跌 ${b.washed} 个</strong><p class="meta">筑底改善 ${b.improving} 个</p></div><div><div class="label">主指数风险</div><strong>距一年高点 ${pct(main.drawdown)}</strong><p class="meta">20日实现波动 ${pct(main.vol20)}</p></div></div><div class="coverage">${context}</div>`;
$('metrics').innerHTML=Object.entries(r.indices).map(([c,f])=>`<tr><td><button class="link-button" data-index="${esc(c)}">${esc(f.name)}</button></td><td>${num(f.close)}</td><td>${pct(f.ret63)}</td><td>${pct(f.drawdown)}</td><td>${pct(f.bias200)}</td><td>${num(f.rsi14,1)}</td><td>${pct(f.vol20)}</td></tr>`).join('');$('metrics').querySelectorAll('button').forEach(b=>b.onclick=()=>indexDetails(b.dataset.index));const selected=$('indexSelect').value;$('indexSelect').innerHTML=Object.entries(r.indices).map(([c,f])=>`<option value="${esc(c)}">${esc(f.name)}</option>`).join('');$('indexSelect').value=r.indices[selected]?selected:m.primary;renderEvents(m);draw(m)}
function renderEvents(m){const rows=[...(m.events||[])].reverse(),out=expanded?rows:rows.slice(0,10),format=o=>o?`${pct(o.return)} / ${pct(o.min_from_signal)}`:'—';$('events').innerHTML=out.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.top)}</td><td>${esc(r.bottom)}</td><td>${format(r.forward['21'])}</td><td>${format(r.forward['63'])}</td></tr>`).join('');$('moreEvents').hidden=rows.length<=10;$('moreEvents').textContent=expanded?'收起':'展开全部';$('moreEvents').setAttribute('aria-expanded',String(expanded))}
function draw(m){if(!window.echarts){$('priceChart').textContent='图表组件未加载，以上真实文字数据仍可查看';return}const code=$('indexSelect').value,all=m.prices[code],rows=all.slice(-range),dates=rows.map(r=>r.date);const avg=n=>rows.map(r=>{const i=all.findIndex(x=>x.date===r.date);return i>=n-1?all.slice(i-n+1,i+1).reduce((s,r)=>s+r.close,0)/n:null});priceChart=priceChart||echarts.init($('priceChart'));stateChart=stateChart||echarts.init($('stateChart'));const states=Object.fromEntries(m.history.map(r=>[r.date,r]));const tooltip={trigger:'axis',appendToBody:true,confine:false,backgroundColor:'#fff',borderColor:'#ccd5df',textStyle:{color:'#1f2733'},formatter:ps=>{const d=ps[0]?.axisValue,r=states[d];return `<strong>${esc(d)}</strong><br>${ps.filter(p=>p.value!=null).map(p=>`${esc(p.seriesName)} ${num(p.value)}`).join('<br>')}${r?`<br>${esc(r.top)} · ${esc(r.bottom)}`:''}`}},grid={left:60,right:18,top:44,bottom:32};priceChart.setOption({animation:false,tooltip,legend:{data:['收盘','20日线','50日线','200日线'],textStyle:{color:'#606c7c'},itemWidth:14},grid,xAxis:{type:'category',data:dates,axisLabel:{color:'#868e9a',formatter:v=>v.slice(5)},axisLine:{lineStyle:{color:'#ccd5df'}}},yAxis:{type:'value',scale:true,axisLabel:{color:'#868e9a'},splitLine:{lineStyle:{color:'#e6e8ec'}}},series:[['收盘',rows.map(r=>r.close),'#3d6a9e'],['20日线',avg(20),'#9bb1c9'],['50日线',avg(50),'#697586'],['200日线',avg(200),'#bac3cf']].map(([name,data,color])=>({name,type:'line',data,showSymbol:false,connectNulls:false,lineStyle:{width:name==='收盘'?2:1.2,color},itemStyle:{color}}))},true);const topMap={'未见顶部共振':0,'过热累积':1,'顶部风险确认':2},botMap={'未见底部共振':0,'底部观察区':1,'筑底改善':2,'趋势修复确认':3};stateChart.setOption({animation:false,tooltip:{trigger:'axis',appendToBody:true,confine:false,formatter:ps=>{const r=states[ps[0]?.axisValue];return r?`${esc(r.date)}<br>${esc(r.top)}<br>${esc(r.bottom)}`:'—'}},legend:{data:['顶部风险阶段','底部迹象阶段','下行压力'],textStyle:{color:'#606c7c'},itemWidth:14},grid:{...grid,top:38},xAxis:{type:'category',data:dates,axisLabel:{formatter:v=>v.slice(5),color:'#868e9a'}},yAxis:{type:'value',min:0,max:3,interval:1,axisLabel:{formatter:v=>['未共振','观察','价格确认','修复确认'][v],color:'#868e9a'},splitLine:{lineStyle:{color:'#e6e8ec'}}},series:[{name:'顶部风险阶段',color:'#697586',lineStyle:{color:'#697586'},type:'line',step:'end',showSymbol:false,data:dates.map(d=>states[d]?topMap[states[d].top]??0:null)},{name:'底部迹象阶段',color:'#3d6a9e',lineStyle:{color:'#3d6a9e'},type:'line',step:'end',showSymbol:false,data:dates.map(d=>states[d]?botMap[states[d].bottom]:null)},{name:'下行压力',color:'#bbc5d1',type:'bar',data:dates.map(d=>states[d]?.top==='中期下行压力'?1:0)}]},true)}
async function refresh(){if(busy)return;busy=true;$('rb').disabled=true;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);let r;try{r=await fetch('data/market_cycle.json?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.schema!=='market-cycle-1'||!d.markets?.cn||!d.markets?.us)throw Error('数据格式不符');DATA=d}finally{clearTimeout(timer)}render()}catch(e){$('notice').hidden=false;$('notice').textContent=DATA?'新数据读取失败，保留原行情日判断':'数据暂未可用：'+e.message;if(!DATA)$('st').textContent='暂不能判断'}finally{busy=false;$('rb').disabled=false}}
$('rb').onclick=refresh;document.querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>{market=b.dataset.market;expanded=false;render()});document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=+b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(DATA?.markets[market]?.latest)draw(DATA.markets[market])});$('indexSelect').onchange=()=>draw(DATA.markets[market]);$('moreEvents').onclick=()=>{expanded=!expanded;renderEvents(DATA.markets[market])};addEventListener('resize',()=>{priceChart?.resize();stateChart?.resize()});refresh();setInterval(()=>{if(!document.hidden)refresh()},300000);
</script></body></html>
