name: Refresh preview official data

# 收盘补查只采集期指四品种，不被SSE份额、全球风险或成交额任务阻塞。
# UTC调度：北京时间15:35–17:55每10分钟，20:10/22:10兜底；23:30保留原全量任务。
# 当日源未发布/无变化不写旧日期，不空提交；schedule可能排队。
on:
  schedule:
    - cron: "35,45,55 7 * * 1-5"
    - cron: "5,15,25,35,45,55 8-9 * * 1-5"
    - cron: "10 12,14 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Run ETF/global/turnover collection as well'
        type: boolean
        default: false
      verify_publish:
        description: 'Smoke-test existing Pages build request and verify collected files'
        type: boolean
        default: false

# 最小权限: 仅 contents write(用于提交 preview-data/),不通知、不扩权、不需 secret。
permissions:
  contents: write
  pages: write # Publish collected futures JSON through the existing Pages site.

concurrency:
  group: refresh-preview-official
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main (采集前,保证干净基线)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 20
          persist-credentials: true

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_TERMINAL_PROMPT=0

      - name: Collect published futures independently (no unrelated sources)
        id: members
        continue-on-error: true # Publish valid products, then fail the final date gate if incomplete.
        shell: bash
        run: |
          set -uo pipefail
          python3 futures_close_update.py --mode members | tee /tmp/members-result.json
          code=${PIPESTATUS[0]}
          python3 - << 'PY'
          import json, os
          result = json.load(open('/tmp/members-result.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('data_date=' + result.get('date', '') + '\n')
          PY
          exit "$code"

      - name: Setup Python + preview-tools deps (ACM .xls 需要 pinned xlrd)
        if: github.event.schedule == '30 15 * * 1-5' || inputs.full_refresh == true
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install preview-tools requirements
        if: github.event.schedule == '30 15 * * 1-5' || inputs.full_refresh == true
        shell: bash
        run: python3 -m pip install --disable-pip-version-check -r preview-tools/requirements.txt

      - name: Run collector (官方SSE+CFFEX; global容错)
        id: full
        continue-on-error: true # Independent source failure must not discard valid futures additions.
        if: github.event.schedule == '30 15 * * 1-5' || inputs.full_refresh == true
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(python3 -c 'import datetime as d; from futures_close_update import strategy_target_day, TZ; print(strategy_target_day(d.datetime.now(TZ)).strftime("%Y%m%d"))')
          python3 preview-tools/collect_preview.py --date "$TARGET"
          TARGET_DATE="$TARGET" python3 - << 'PY'
          import json, os, sys
          data = json.load(open('preview-data/status.json'))
          target = os.environ['TARGET_DATE']
          expected = target[:4]+'-'+target[4:6]+'-'+target[6:]
          sys.exit(0 if data.get('as_of') == expected and data.get('domestic') == 'ok' and data.get('run_status') in ('ok', 'partial') else 1)
          PY

      - name: Refresh intraday turnover baseline (post-close, 同时点对齐分母)
        if: github.event.schedule == '30 15 * * 1-5' || inputs.full_refresh == true
        shell: bash
        run: python3 preview-tools/turnover_baseline.py

      - name: Refresh daily turnover history (新浪 60 分钟 K 按日累加回补)
        if: github.event.schedule == '30 15 * * 1-5' || inputs.full_refresh == true
        shell: bash
        run: python3 preview-tools/turnover_history.py

      - name: Commit only preview-data/ then push (不force、不reset丢数据)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)

          # 只暂存隔离目录,绝不 add 其它路径
          git add preview-data/official preview-data/status.json preview-data/global.json preview-data/turnover-baseline.json preview-data/turnover-history.json
          if git diff --cached --quiet; then
            echo "preview-data 无变化,不提交"
            exit 0
          fi
          git commit -m "preview official data ${STAMP}"

          # push: 失败则 fetch + rebase(快进),冲突即保留工作树并 fail,绝不 reset --hard/force
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "已推送 preview-data/"
              exit 0
            fi
            echo "push 第 ${attempt} 次失败,尝试 fetch + rebase origin/main"
            git fetch --depth=20 origin main
            if ! git rebase origin/main; then
              echo "::error::rebase 冲突,保留工作树,不自动解决、不force;请人工处理后由前端 agent 发布"
              git rebase --abort || true
              exit 1
            fi
          done
          echo "::error::多次 push 失败,已保留提交与工作树"
          exit 1

      - name: Ensure collected futures data is served by GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_PUBLISH: ${{ inputs.verify_publish }}
          EXPECTED_DATA_DATE: ${{ steps.members.outputs.data_date }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$VERIFY_PUBLISH" == "true" ]]; then args+=(--request-build); fi
          python3 futures_pages_sync.py preview-data/official/futures/{IH,IF,IC,IM}.json "${args[@]}"
          python3 futures_close_update.py --mode members --verify-date "$EXPECTED_DATA_DATE"

      - name: Final business result (never green on missing data)
        if: always()
        env:
          MEMBERS_OUTCOME: ${{ steps.members.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
        shell: bash
        run: |
          [[ "$MEMBERS_OUTCOME" == "success" ]] || exit 1
          [[ "$FULL_OUTCOME" != "failure" ]] || exit 1
