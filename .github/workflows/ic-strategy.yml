name: Refresh IC close signal

# 收盘后增量更新 data/ic_strategy.json；不重写旧模型历史。
# UTC 调度：北京时间15:35–17:55每10分钟补查，另保留17:40/20:10，22:10/23:30晚间兜底。
# GitHub schedule可能排队；当天指数与官方今收盘不齐则保留旧日，下次补查。
on:
  schedule:
    - cron: "35,45,55 7 * * 1-5"
    - cron: "5,15,25,35,45,55 8-9 * * 1-5"
    - cron: "40 9 * * 1-5"
    - cron: "10 12,14 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

# 只写 data/ic_strategy.json。仓库 Settings → Actions → Workflow permissions
# 需要 Read and write permissions；若 main 禁止直接推送，还要放行 github-actions[bot]。
permissions:
  contents: write

concurrency:
  group: refresh-ic-strategy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 20
          persist-credentials: true

      - name: Compute only new IC close days (pending sources keep previous)
        shell: bash
        run: python3 futures_close_update.py --mode strategy

      - name: Commit data/ic_strategy.json when the signal changes
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - << 'PY'
          import json, pathlib, sys
          def load(path):
              data = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              data.pop("updated", None)
              return data
          new = load("data/ic_strategy.json")
          old_path = pathlib.Path("/tmp/ic_strategy.prev.json")
          import subprocess
          show = subprocess.run(["git", "show", "HEAD:data/ic_strategy.json"], capture_output=True)
          if show.returncode != 0:
              sys.exit(0)
          old_path.write_bytes(show.stdout)
          old = load(old_path)
          if old == new:
              pathlib.Path("/tmp/ic_strategy.same").write_text("same", encoding="utf-8")
          PY
          if [[ -f /tmp/ic_strategy.same ]]; then
            git checkout -- data/ic_strategy.json
            echo "signal unchanged; skip commit"
            exit 0
          fi
          git add data/ic_strategy.json
          if git diff --cached --quiet; then
            echo "nothing staged; skip commit"
            exit 0
          fi
          STAMP=$(python3 -c 'import json; print(json.load(open("data/ic_strategy.json", encoding="utf-8")).get("latest",""))')
          git commit -m "ic strategy ${STAMP}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed data/ic_strategy.json (${STAMP})"
              exit 0
            fi
            echo "push failed (attempt ${attempt}); rebasing onto origin/main"
            git fetch --depth=20 origin main
            if ! git rebase origin/main; then
              echo "::error::rebase 冲突，保留工作树，不自动解决、不 force"
              git rebase --abort || true
              exit 1
            fi
          done
          echo "::error::多次 push 失败"
          exit 1
