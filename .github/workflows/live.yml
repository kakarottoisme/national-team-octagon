name: Refresh live.json

# One warm runner per verified market session. Five-minute schedules are restart
# opportunities; once started the runner refreshes without re-entering the queue.
# UTC: prewarm at 08:53 / 12:43 Asia/Shanghai, but never collect outside session.
on:
  schedule:
    - cron: "53 0 * * 1-5"
    - cron: "43 4 * * 1-5"
    - cron: "*/5 1-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-json
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
          persist-credentials: true

      - name: Keep live refresh active through the market session
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -B live_runner.py
