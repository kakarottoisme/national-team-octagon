name: Refresh market cycle observations

on:
  schedule:
    # Beijing 08:20 (completed US close), 17:10 (completed A-share close).
    - cron: '20 0 * * 1-5'
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-market-cycle
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Official A-share calendar gate
        id: gate
        run: |
          python3 - <<'PY'
          import datetime as dt, os
          from market_calendar import TZ, is_trading_day
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('trade='+str(is_trading_day(dt.datetime.now(TZ).date())).lower()+'\n')
          PY
      - name: Collect independent completed daily prices
        id: collect
        continue-on-error: true
        if: steps.gate.outputs.trade == 'true'
        run: python3 market_cycle.py
      - name: Commit only new independent dataset
        if: ${{ !cancelled() && steps.gate.outputs.trade == 'true' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/market_cycle.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refresh market cycle observations'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --depth=20 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::market-cycle concurrent conflict; local data retained, no force push"
              exit 1
            fi
          done
          exit 1
      - name: Verify market data is published on Pages
        if: ${{ !cancelled() && steps.gate.outputs.trade == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 futures_pages_sync.py data/market_cycle.json
      - name: Final collection result
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: test "$COLLECT_OUTCOME" != "failure"
