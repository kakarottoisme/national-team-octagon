<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico?v=3" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><title>两融余额 · 指数对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{margin:0;background:#0f1115;color:#d8dbe2;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:10px 14px}h1{font-size:18px;margin:0 12px 0 0;display:inline}a{color:#7a96b0}.note{font-size:12px;color:#889;margin-top:6px}
#ch{height:calc(100vh - 120px);min-height:420px;margin:0 10px;background:#161a21;border:1px solid #262b35;border-radius:8px}</style></head><body>
<header><h1>两融余额 · 指数对比</h1><a href="index.html">← 国家队·分时八宫格</a> <span id="st"></span>
<div class="note">日频收盘数据（非分钟级）。两融余额 = 沪市 + 深市融资融券余额（亿元，左轴），交易所次日披露，通常滞后 1 个交易日。指数为收盘点位（右轴，对数刻度）；点击图例开关。科创板用科创50（000688）。数据：akshare（交易所/新浪）。</div></header>
<div id="ch"></div>
<script>
fetch("data/margin_balance.json?"+Date.now()).then(r=>r.json()).then(d=>{
 const dates=[...new Set([...Object.keys(d.margin),...Object.values(d.index).flatMap(Object.keys)])].filter(x=>x>=Object.keys(d.margin).sort()[0]).sort();
 const ks=Object.keys(d.margin).sort();
 document.getElementById("st").textContent=`两融 ${ks[0]} ~ ${ks.at(-1)}，更新于 ${d.updated}`;
 const cols=["#ffb020","#ff5b5b","#c77dff","#4dabf7","#51cf66","#ff922b","#f06595"];
 const series=[{name:"两融余额(亿)",type:"line",yAxisIndex:0,showSymbol:false,connectNulls:true,lineStyle:{width:2},areaStyle:{opacity:.12},data:dates.map(x=>d.margin[x]??null)}];
 for(const k in d.index)series.push({name:`${k}(${d.codes[k].slice(2)})`,type:"line",yAxisIndex:1,showSymbol:false,connectNulls:true,lineStyle:{width:1.2},data:dates.map(x=>d.index[k][x]??null)});
 const c=echarts.init(document.getElementById("ch"),"dark");
 c.setOption({backgroundColor:"transparent",color:cols,animation:false,tooltip:{trigger:"axis"},legend:{top:6},grid:{top:50,left:60,right:60,bottom:70},
  xAxis:{type:"category",data:dates},yAxis:[{type:"value",name:"亿元",scale:true,splitLine:{lineStyle:{color:"#262b35"}}},{type:"log",name:"点位",splitLine:{show:false}}],
  dataZoom:[{type:"inside",start:70},{type:"slider",start:70}],series});
 addEventListener("resize",()=>c.resize());
});
</script></body></html>
