function drawCurveChart(el,m,color,title,yMinZero){
 const rawKeys=Object.keys(m.value);
 const map={};rawKeys.forEach(k=>{map[normTenor(k)]=m.value[k]});
 const xs=TENOR_ORDER.filter(k=>map[k]!=null);

  title:{text:title,left:4,top:0,textStyle:{fontSize:12,color:'#1f2733',fontWeight:600}},
  tooltip:{trigger:'axis'},

function sortedHist(m){
 if(!m.history)return [];
 return m.history.filter(h=>h&&h.date&&h.value!=null).slice().sort((a,b)=>a.date.localeCompare(b.date));
}
function fmtChange(m){
 const h=sortedHist(m);if(h.length<2)return '';
 const last=h[h.length-1];
 if(m.as_of&&last.date!==m.as_of){
  return '趋势止于 '+last.date.slice(0,10)+'（与 as_of '+m.as_of+' 不一致，待 source 修正）';
 }
 const prev=h[h.length-2];
 const diff=last.value-prev.value;const sign=diff>=0?'+':'';
 const u=(m.unit||'').toLowerCase();
 let u2='';
 if(u.includes('percent')||u==='%')u2='pp';
 else if(u.includes('bp')||u.includes('basis'))u2='bp';
 else if(u.includes('index')||u.includes('vix')||u.includes('corr'))u2='点';
 return sign+diff.toFixed(2)+u2+' ('+(last.date||'').slice(5)+')';

 add('说明',m.note);

 add('源链接',m.source_url,true);
 add('跳源链接',m.link_url,true);
 add('license',m.license);
 add('license 条款',m.license_url,true);
 add('版权声明',m.copyright_notice);
 add('免责',m.disclaimer);
 add('使用条款',m.terms_notice_en);
 add('受限原因',m.restricted_reason);
 openDrawer();
}
async function refresh(){
 if(busy)return;busy=true;const rb=$('rb');rb.disabled=true;rb.textContent='读取中…';
 try{
  let d=null;try{const r=await fetch('preview-data/global.json?t='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}
  if(!d||!Array.isArray(d.metrics)){$('banner').style.display='block';$('banner').textContent='未读取到本地快照 preview-data/global.json';$('st').textContent='快照未加载';$('grid').innerHTML='';$('groups').innerHTML='';return}
  DATA=d;$('banner').style.display='none';
  let lastRun='—';try{const sr=await fetch('preview-data/status.json?t='+Date.now(),{cache:'no-store'});if(sr.ok){const sj=await sr.json();const t=sj.last_run||sj.generated_at;if(t)lastRun=t.slice(0,16).replace('T',' ')}}catch(e){}
  $('st').textContent='最近采集 '+lastRun+' · 已可观察 '+d.metrics.filter(m=>m.status==='connected').length+' 项 · 完整目录 '+d.metrics.length+' 项';
  renderGroups();renderCurve();renderSparks();render();
 }finally{busy=false;rb.disabled=false;rb.textContent='刷新'}
}
refresh();
window.addEventListener('resize',()=>{if(curveChart)curveChart.resize()});
</script><script>
/* ===== Unified dashboard dialogs and route continuity ===== */
window.uiPanel=(()=>{
 let active=null;
 function close(){
  if(!active)return;const state=active;active=null;
  state.node.hidden=true;document.body.style.overflow=state.overflow;
  state.inert.forEach(item=>{item.el.inert=item.was});
  if(state.focus&&state.focus.isConnected)state.focus.focus();
 }
 function open(id){
  const node=document.getElementById(id);if(!node)return;
  if(active&&active.node===node)return;if(active)close();
  active={node,focus:document.activeElement,overflow:document.body.style.overflow,inert:[]};
  for(const el of [document.querySelector('header.top'),document.querySelector('main')].filter(Boolean)){
   active.inert.push({el,was:el.inert});el.inert=true;
  }
  node.hidden=false;document.body.style.overflow='hidden';
  const body=node.querySelector('.ui-modal-body');if(body)body.scrollTop=0;
  const focus=node.querySelector('button.ui-close');if(focus)focus.focus();
 }
 document.addEventListener('keydown',event=>{
  if(!active)return;
  if(event.key==='Escape'){event.preventDefault();close();return}
  if(event.key!=='Tab')return;
  const focusable=[...active.node.querySelectorAll('button,a[href],input,select,textarea,[tabindex]')].filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);
  if(!focusable.length){event.preventDefault();return}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
 });
 // Preserve an explicit version query across the four links so a user who
 // opens the delivered cache-busting URL does not return to older tab HTML.
 const version=new URLSearchParams(location.search).get('v');
 if(version&&/^[A-Za-z0-9_-]{1,64}$/.test(version))document.querySelectorAll('.view-tab').forEach(link=>{
  const url=new URL(link.getAttribute('href'),location.href);url.searchParams.set('v',version);link.href=url.href;
 });
 return {open,close};
})();
/* ===== End unified dashboard UI behavior ===== */
</script></body></html>
