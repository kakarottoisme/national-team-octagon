function normTenor(k){
 const up=k.toUpperCase().replace(/\s+/g,'');
 const map={'1MO':'1 Mo','1.5MO':'1.5 Month','2MO':'2 Mo','3MO':'3 Mo','4MO':'4 Mo','6MO':'6 Mo','1Y':'1 Yr','2Y':'2 Yr','3Y':'3 Yr','5Y':'5 Yr','7Y':'7 Yr','10Y':'10 Yr','20Y':'20 Yr','30Y':'30 Yr',

}
function drawCurveChart(el,m,color,title,yMinZero){
 const rawKeys=Object.keys(m.value);
 const map={};rawKeys.forEach(k=>{map[normTenor(k)]=m.value[k]});
 const xs=TENOR_ORDER.filter(k=>map[k]!=null);
 const ys=xs.map(k=>map[k]);
 if(!el||!xs.length)return null;
 const c=echarts.init(el);
 const yAxis={type:'value',axisLabel:{fontSize:10,color:'#868e9a',formatter:'{value}%'}};
 // Real yields can be negative. Do not clip below zero.
 c.setOption({backgroundColor:'transparent',animation:false,
  grid:{left:46,right:20,top:22,bottom:38},
  tooltip:{trigger:'axis',confine:true},
  xAxis:{type:'category',data:xs.map(k=>TENOR_LABEL[k]||k),axisLabel:{fontSize:12,color:'#707b8b',hideOverlap:true}},
  yAxis,
  series:[{type:'line',data:ys,smooth:false,symbol:'circle',symbolSize:4,
   lineStyle:{color,width:2},itemStyle:{color},
   label:{show:el.clientWidth>=700,fontSize:12,color:'#4a5260',formatter:p=>p.value},labelLayout:{hideOverlap:true}}]
 });
 return c;
}

function sortedHist(m){
 if(!m.history)return [];
 return m.history.filter(h=>h&&h.date&&h.value!=null).slice().sort((a,b)=>a.date.localeCompare(b.date));
}
function fmtChange(m){
 const h=sortedHist(m);if(h.length<2)return '';
 const last=h[h.length-1];
 if(m.as_of&&last.date!==m.as_of){
  return '趋势止于 '+last.date.slice(0,10)+'（与 as_of '+m.as_of+' 不一致，待 source 修正）';
 }
 const prev=h[h.length-2];
 const diff=last.value-prev.value;const sign=diff>=0?'+':'';
 const u=(m.unit||'').toLowerCase();
 let u2='';
 if(u.includes('percent')||u==='%')u2='pp';
 else if(u.includes('bp')||u.includes('basis'))u2='bp';
 else if(u.includes('index')||u.includes('vix')||u.includes('corr'))u2='点';
 return sign+diff.toFixed(2)+(u2==='pp'?' 个百分点':u2==='bp'?' 基点':u2)+' ('+(last.date||'').slice(5)+')';
}

  const c=echarts.init(chEl);sparkCharts.push(c);

   sec.querySelector('.c').textContent=slow.length+' 项';sec.querySelector('.panel-head + div').remove();const help=document.createElement('button');help.type='button';help.textContent='口径说明';help.addEventListener('click',()=>openLayerGuide('背景慢变量',PANEL_Q.S_slow_variables));sec.querySelector('.panel-head').appendChild(help);
   slow.forEach(m=>sec.appendChild(rowHtml(m)));

  }
 }

}
function renderGroups(){
 const counts={};DATA.metrics.forEach(m=>{counts[m.layer]=(counts[m.layer]||0)+1});
 $('groups').innerHTML='';
 ['全部'].concat(LAYERS.map(l=>GL[l[0]])).forEach(g=>{
  const layer=LAYERS.find(l=>GL[l[0]]===g);
  const c=g==='全部'?DATA.metrics.length:(counts[layer[0]]||0);
  const b=document.createElement('button');b.type='button';b.className='gchip'+(g===cur?' on':'');b.textContent=g+' ('+c+')';
  b.setAttribute('aria-pressed',String(g===cur));b.addEventListener('click',()=>{cur=g;renderGroups();render();document.querySelectorAll('#groups button').forEach(x=>{if(x.textContent.startsWith(g+' ('))x.focus()});const u=new URL(location.href);u.searchParams.set('group',g);history.replaceState(null,'',u)});

function openDetail(id){
 const m=DATA.metrics.find(x=>x.id===id);if(!m)return;
 $('dName').textContent=cnName(m);

 const body=$('dBody');body.innerHTML='';

  const dt=document.createElement('dt');dt.textContent=k;
  const dd=document.createElement('dd');

 };

async function refresh(){
 if(busy)return;busy=true;const rb=$('rb');rb.disabled=true;rb.textContent='读取中…';
 try{
  let d=null;try{d=await readJSON('preview-data/global.json?t='+Date.now())}catch(e){}
  if(!d||!Array.isArray(d.metrics)){$('banner').style.display='block';$('banner').textContent='本次快照读取失败；保留上次可用结果，未更新成功。点击刷新重试';$('st').textContent='快照未加载';if(!DATA){$('grid').innerHTML='';$('groups').innerHTML='';$('curve').parentElement.hidden=true;$('sparks').hidden=true}return}
  DATA=d;$('banner').style.display='none';const query=new URLSearchParams(location.search).get('group');if(query==='全部'||LAYERS.some(l=>l[1]===query))cur=query;
  let lastRun='—';try{const sj=await readJSON('preview-data/status.json?t='+Date.now());{const t=sj.last_run||sj.generated_at;if(t)lastRun=t.slice(0,16).replace('T',' ')}}catch(e){}
  $('st').textContent='最近采集 '+lastRun+' · 已可观察 '+d.metrics.filter(m=>m.status==='connected').length+' 项 · 完整目录 '+d.metrics.length+' 项';
  $('riskFoot').textContent='这是公开数据快照目录，当前已接入 '+d.metrics.filter(isLicensed).length+' 项 / 共 '+d.metrics.length+' 项。已接入不等于实时，逐项核对数据日期；跳源、受限、待接入、缺数据不能当成零。仅阅读来源许可范围内的数据，不评级，不生成交易建议。';
  renderGroups();render();
 }finally{busy=false;rb.disabled=false;rb.textContent='刷新'}
}
refresh();

/* ===== Unified dashboard dialogs and route continuity ===== */
window.uiPanel=(()=>{
 let active=null;
 function close(){
  if(!active)return;const state=active;active=null;
  state.node.hidden=true;document.body.style.overflow=state.overflow;
  state.inert.forEach(item=>{item.el.inert=item.was;if(item.aria==null)item.el.removeAttribute('aria-hidden');else item.el.setAttribute('aria-hidden',item.aria)});
  if(state.focus&&state.focus.isConnected)state.focus.focus();
 }
 function open(id){
  const node=document.getElementById(id);if(!node)return;
  if(active&&active.node===node)return;if(active)close();
  active={node,focus:document.activeElement,overflow:document.body.style.overflow,inert:[]};
  for(const el of [document.querySelector('header.top'),document.querySelector('main')].filter(Boolean)){
   active.inert.push({el,was:el.inert,aria:el.getAttribute('aria-hidden')});el.inert=true;el.setAttribute('aria-hidden','true');
  }
  node.hidden=false;document.body.style.overflow='hidden';
  const body=node.querySelector('.ui-modal-body');if(body)body.scrollTop=0;
  const focus=node.querySelector('button.ui-close');if(focus)focus.focus();
 }
 document.addEventListener('keydown',event=>{
  if(!active)return;
  if(event.key==='Escape'){event.preventDefault();close();return}
  if(event.key!=='Tab')return;
  const focusable=[...active.node.querySelectorAll('button,a[href],input,select,textarea,[tabindex]')].filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);
  if(!focusable.length){event.preventDefault();return}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
 });
 // Preserve an explicit version query across the four links so a user who
 // opens the delivered cache-busting URL does not return to older tab HTML.
 const version=new URLSearchParams(location.search).get('v');
 if(version&&/^[A-Za-z0-9_-]{1,64}$/.test(version))document.querySelectorAll('.view-tab').forEach(link=>{
  const url=new URL(link.getAttribute('href'),location.href);url.searchParams.set('v',version);link.href=url.href;
 });
 return {open,close};
})();
/* Remember only display preferences within this browser tab. */
(()=>{const key='dashboard-view:'+location.pathname.split('/').at(-1);const allowed=['date','product','window','metric','signal','group','range','index'];const save=()=>{const q=new URLSearchParams(location.search),out=new URLSearchParams();allowed.forEach(k=>{if(q.has(k))out.set(k,q.get(k))});try{sessionStorage.setItem(key,out.toString())}catch(e){}};addEventListener('pagehide',save);document.querySelectorAll('.view-tab').forEach(a=>a.addEventListener('click',()=>{save();const u=new URL(a.href);try{const saved=new URLSearchParams(sessionStorage.getItem('dashboard-view:'+u.pathname.split('/').at(-1))||'');allowed.forEach(k=>{if(saved.has(k))u.searchParams.set(k,saved.get(k))})}catch(e){}a.href=u.href}));})();
/* ===== End unified dashboard UI behavior ===== */
