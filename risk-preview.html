<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=signal-1"><link rel="icon" type="image/svg+xml" sizes="64x64" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22signal-blue%22%20x1%3D%2212%22%20y1%3D%2249%22%20x2%3D%2238%22%20y2%3D%2213%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%0A%20%20%20%20%20%20%3Cstop%20stop-color%3D%22%23507CEA%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2364A5ED%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22signal-cyan%22%20x1%3D%2233%22%20y1%3D%2244%22%20x2%3D%2252%22%20y2%3D%2222%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%0A%20%20%20%20%20%20%3Cstop%20stop-color%3D%22%2358BED2%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2383D8DB%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Cpath%20d%3D%22M9%2046%2025%2016c2-4%207-4%209%200l16%2030c2%204-1%207-5%207h-5L28%2029%2017%2049c-2%204-10%203-8-3Z%22%20fill%3D%22url%28%23signal-blue%29%22%2F%3E%0A%20%20%3Cpath%20d%3D%22m32%2047%2013-24c2-4%208-1%206%203L40%2049c-3%206-11%203-8-2Z%22%20fill%3D%22url%28%23signal-cyan%29%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2251%22%20cy%3D%2214%22%20r%3D%225%22%20fill%3D%22%2377CFD9%22%2F%3E%0A%3C%2Fsvg%3E%0A"><title>全球风险预览</title>
<style>
:root{--page:#f5f6f8;--card:#fff;--line:#e6e8ec;--line-2:#f0f1f4;--ink:#1f2733;--ink-2:#4a5260;--muted:#868e9a;--faint:#b0b6bf;--accent:#3d6a9e;--chip:#f2f4f7;--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink-2);font:14px/1.55 var(--font);font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;flex:none}.mark svg{display:block;width:38px;height:38px}
h1{margin:0;font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.crumb{font-size:12px;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid #e0e5ed;border-radius:14px;height:38px;padding:0 16px;cursor:pointer}
.top .nav-row{padding-top:0;padding-bottom:12px}
.view-tabs{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid #e7ebf0;border-radius:18px;background:#f4f6f9}
.view-tab{display:flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 19px;border-radius:14px;color:#7b8492;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}
.view-tab:hover{background:#e9edf4;color:#4c678e;text-decoration:none}
.view-tab[aria-current="page"]{background:#fff;color:#3f6baf;box-shadow:0 1px 4px rgba(39,63,101,.09);font-weight:600}
.view-tab svg{width:16px;height:16px;flex:none}
.pv-chip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:500;color:#8a6d2f;background:#fdf3e0;border:1px solid #ecd9a6;vertical-align:middle;white-space:nowrap}
.sec{margin:16px 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
h2{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.sec .side{font-size:12px;color:var(--muted)}
#st{font-size:12px;color:var(--muted);line-height:1.7}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.gchip{height:32px;padding:0 14px;border-radius:14px;font-size:13px;border:1px solid #e0e5ed;background:#fff;color:#4a5260;cursor:pointer}
.gchip.on{background:#edf3fc;border-color:#c8daf2;color:#3f6baf;font-weight:600}
#banner{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--chip);border:1px solid var(--line);font-size:13px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:visible}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line-2);background:#fafbfc}
.panel-head .t{font-size:13px;font-weight:600;color:var(--ink)}
.panel-head .c{font-size:11px;color:var(--faint)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start;width:100%;padding:10px 14px;border:0;background:#fff;border-bottom:1px solid var(--line-2);cursor:pointer;text-align:left;font:inherit;height:auto;min-height:64px;white-space:normal}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:#f6f9fd}
.mrow .n{grid-column:1;font-size:13px;color:var(--ink);font-weight:500;line-height:1.4;min-width:0}
.mrow .v{grid-column:1;font-size:12.5px;color:var(--muted);line-height:1.5;min-width:0;word-break:break-word}
.mrow .b{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;color:var(--faint);white-space:nowrap;padding-top:2px}
.tag{display:inline-block;padding:0 5px;border-radius:4px;font-size:10px;line-height:16px}
.t-connected{color:#fff;background:#3d6a9e}
.t-stale{color:#8a6d2f;background:#fdf3e0;border:1px solid #ecd9a6}
.t-link{color:#3d6a9e;background:#edf3fc;border:1px solid #c8daf2}
.t-restricted{color:#8a6d2f;background:#fdf3e0;border:1px solid #ecd9a6}
.t-pending{color:#5a6470;background:#f2f4f7;border:1px solid #e0e5ed}
.t-missing{color:#868e9a;background:#f6f7f9;border:1px dashed #d6dae0}
.foot{padding:10px 0 6px;font-size:12px;color:var(--faint);line-height:1.8}
.drawer-mask{position:fixed;inset:0;background:rgba(31,39,51,.28);z-index:50;display:none}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);background:var(--card);z-index:51;box-shadow:-8px 0 28px rgba(31,39,51,.16);transform:translateX(105%);transition:transform .22s ease;overflow-y:auto;padding:18px 20px}
.drawer.open{transform:translateX(0)}
.drawer h3{margin:0 0 2px;font-size:15px;color:var(--ink)}
.drawer .x{position:absolute;top:12px;right:12px}
.drawer dl{margin:14px 0 0;display:grid;grid-template-columns:92px 1fr;gap:10px 12px;font-size:13px}
.drawer dt{color:var(--muted)}.drawer dd{margin:0;color:var(--ink-2);word-break:break-word}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:699px){.view-tabs{display:flex;width:100%;overflow-x:auto;scrollbar-width:none}.view-tab{flex:none;min-height:40px;padding:0 14px}.view-tab svg{display:none}}
</style></head><body>
<header class="top"><div class="wrap">
 <div class="brand">
  <span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs><linearGradient id="signal-blue" x1="12" y1="49" x2="38" y2="13" gradientUnits="userSpaceOnUse"><stop stop-color="#507CEA"/><stop offset="1" stop-color="#64A5ED"/></linearGradient><linearGradient id="signal-cyan" x1="33" y1="44" x2="52" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#58BED2"/><stop offset="1" stop-color="#83D8DB"/></linearGradient></defs>
  <path d="M9 46 25 16c2-4 7-4 9 0l16 30c2 4-1 7-5 7h-5L28 29 17 49c-2 4-10 3-8-3Z" fill="url(#signal-blue)"/>
  <path d="m32 47 13-24c2-4 8-1 6 3L40 49c-3 6-11 3-8-2Z" fill="url(#signal-cyan)"/>
  <circle cx="51" cy="14" r="5" fill="#77CFD9"/></svg></span>
  <div><h1>全球风险预览<span class="pv-chip">预览</span></h1><div class="crumb">公开数据安全快照 · 仅 Treasury 名义曲线直取 · 其余跳源/受限/待接入 · 不评级不构成建议</div></div>
 </div>
 <div class="ctl"><button id="rb" type="button" onclick="refresh()">重读本地快照</button></div>
</div><div class="wrap nav-row"><nav class="view-tabs" aria-label="预览页导航">
 <a class="view-tab" href="preview.html"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 14V9m5 5V5m5 9V8m4 6V3"/></svg><span>资金观察</span></a>
 <a class="view-tab" href="margin-preview.html"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 10h10M3 14h14"/><circle cx="7" cy="6" r="2" fill="#fff"/><circle cx="13" cy="14" r="2" fill="#fff"/></svg><span>两融余额</span></a>
 <a class="view-tab" href="futures-preview.html"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 3h7l4 4v10H6z"/><path d="M13 3v4h4M9 11h5M9 14.5h5"/></svg><span>期指持仓</span></a>
 <a class="view-tab" href="risk-preview.html" aria-current="page"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M3.5 10h13M10 3.5c-2.8 2.8-2.8 10.2 0 13 2.8-2.8 2.8-10.2 0-13Z"/></svg><span>全球风险</span></a>
</nav></div></header>

<main class="wrap">
<div class="sec"><h2>风险指标（37 项 · 按公开数据状态陈列）</h2><span class="side" id="st">加载中…</span></div>
<div class="groups" id="groups"></div>
<div id="banner"></div>
<div class="grid" id="grid"></div>
<div class="foot">schema 2.0-safe：仅 Treasury 名义曲线为 connected 直取（as_of 2026-11-03）；其余按 link_only（跳源）/restricted（版权受限不转录）/pending（待公开源接入）/missing（缺数据）陈列，不渲染受限数值、不补造、不评级、不继承 L0–L4。本看板未自动接入，重读仅加载本地快照。</div>
</main>

<div class="drawer-mask" id="mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"><button class="x" type="button" onclick="closeDrawer()">关闭</button>
<h3 id="dName">—</h3><div style="font-size:12px;color:var(--muted);margin-top:2px" id="dCat">—</div>
<dl id="dBody"></dl></aside>

<script>
const $=id=>document.getElementById(id);
const LAYERS=[['A_macro_rates','宏观利率'],['B_credit','信用'],['C_second_order_vol','二阶波动'],['D_mm_structure','做市结构'],['E_first_order_sentiment','一阶情绪'],['F_price_breadth','价格宽度']];
const GL={};LAYERS.forEach(l=>GL[l[0]]=l[1]);
const CN={
 'A1_move':'MOVE 美债波动率','A2_move_vix_ratio':'MOVE/VIX 比','A3_yield_curve_nominal':'美债名义收益率曲线','A3b_yield_curve_real':'美债实际收益率曲线(TIPS)',
 'B1_hy_oas':'高收益债 OAS','B2_ig_oas':'投资级债 OAS','C1_skew':'CBOE SKEW 偏度','C2_vvix':'VVIX 隐含波动率的波动率','C3_vix_vix3m':'VIX/VIX3M 期限结构','C4_vix9d_vix':'VIX9D/VIX 短期比','C5_pc_63d_vs_skew_5d':'认沽/认购偏度 5 日剪刀差',
 'D1_gex':'Dealer Gamma 敞口','D2_corr_1m':'CBOE 1 个月隐含相关性','D3_vixeq_tech_crowding':'VIXEQ 科技股拥挤度','D4_vxn_term_premium':'VXN 科技股期限溢价',
 'E1_vix':'CBOE VIX','E2_put_call_structure':'认沽/认购结构(指数与个股)','E3_sentiment_surveys':'BofA FMS/AAII/NAAIM 情绪调查','E4_margin_debt_yoy':'FINRA 保证金余额同比','E5_qqq_soxx_shock':'QQQ/SOXX 单日冲击',
 'F1_nvda_vs_ma':'NVDA vs 50/200 日均线','F2_phlx_semis_drawdown':'PHLX 半导体(SOX)回撤','F3_spx_vs_ma':'标普500 vs 50/200 日均线','F4_ew_minus_cw_drag':'等权-市值加权 回撤差','F5_kospi_jpy_carry':'韩股/日元套息 unwind',
 'S1_sahm':'Sahm 规则实时','S2_nfci':'芝加哥联储 NFCI','S3_real_10y':'10Y TIPS 实际利率','S4_term_premium':'ACM 10Y 期限溢价','S5_sofr_iorb':'SOFR-IORB 融资利差','S6_brent':'布伦特原油','S7_cape':'Shiller CAPE'
};
function cnName(m){return CN[m.id]||m.name}
const ST_TXT={connected:'已直取',connected_stale:'已直取·陈旧',link_only:'跳源',restricted:'受限',pending:'待接入',missing:'缺数据'};
const ST_CLS={connected:'t-connected',connected_stale:'t-stale',link_only:'t-link',restricted:'t-restricted',pending:'t-pending',missing:'t-missing'};
let DATA=null,cur='全部',busy=false;
function openDrawer(){$('drawer').classList.add('open');$('mask').classList.add('open')}
function closeDrawer(){$('drawer').classList.remove('open');$('mask').classList.remove('open')}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeDrawer()});

function shortValue(m){
 const licensed=(m.status==='connected'||m.status==='connected_stale');
 const staleMark=m.status==='connected_stale'?'<span style="color:#8a6d2f">陈旧·</span>':'';
 if(licensed&&m.value){
  if(typeof m.value==='object'){
   const keys=Object.keys(m.value);
   return staleMark+'名义曲线 '+keys.length+' 段 · 10Y '+(m.value['10 Yr']||'—')+'%';
  }
  return staleMark+m.value+(m.unit?' '+m.unit:'');
 }
 if(m.status==='link_only')return '<span style="color:var(--muted)">跳源查看 · 不转录数值</span>';
 if(m.status==='restricted')return '<span style="color:#8a6d2f">ICE 版权受限 · 不转录</span>';
 if(m.status==='pending')return '<span style="color:var(--muted)">待公开源接入</span>';
 return '<span style="color:var(--faint)">缺数据 · 不补 0</span>';
}
function rowHtml(m){
 return '<button class="mrow" onclick="openDetail(\''+m.id+'\')">'+
  '<span class="n">'+cnName(m)+'</span>'+
  '<span class="v">'+shortValue(m)+'</span>'+
  '<span class="b"><span class="tag '+ST_CLS[m.status]+'">'+ST_TXT[m.status]+'</span>'+
  '<span style="font-size:10px">'+(m.as_of?m.as_of:'—')+'</span></span></button>';
}
function panelHtml(layer,list){
 if(!list.length)return '';
 return '<section class="panel"><div class="panel-head"><span class="t">'+GL[layer]+'</span><span class="c">'+list.length+' 项</span></div>'+list.map(rowHtml).join('')+'</section>';
}
function render(){
 if(!DATA)return;
 const main=DATA.metrics.filter(m=>m.layer!=='S_slow_variables');
 const list=cur==='全部'?main:main.filter(m=>m.layer===LAYERS.find(l=>GL[l[0]]===cur)[0]);
 $('grid').innerHTML=LAYERS.filter(l=>cur==='全部'||GL[l[0]]===cur).map(l=>panelHtml(l[0],list.filter(m=>m.layer===l[0]))).join('');
 const slow=DATA.metrics.filter(m=>m.layer==='S_slow_variables');
 if(slow.length&&cur==='全部'){
  $('grid').innerHTML+='<section class="panel" style="grid-column:1/-1"><div class="panel-head"><span class="t">背景慢变量</span><span class="c">'+slow.length+' 项</span></div>'+slow.map(rowHtml).join('')+'</section>';
 }
}
function renderGroups(){
 const counts={};DATA.metrics.forEach(m=>{if(m.layer!=='S_slow_variables')counts[m.layer]=(counts[m.layer]||0)+1});
 $('groups').innerHTML=['全部'].concat(LAYERS.map(l=>GL[l[0]])).map(g=>{
  const layer=LAYERS.find(l=>GL[l[0]]===g);
  const c=g==='全部'?DATA.metrics.length:(counts[layer[0]]||0);
  return '<button type="button" class="gchip'+(g===cur?' on':'')+'" onclick="setGroup(\''+g+'\')">'+g+' ('+c+')</button>';
 }).join('');
}
function setGroup(g){cur=g;renderGroups();render()}
function openDetail(id){
 const m=DATA.metrics.find(x=>x.id===id);if(!m)return;
 $('dName').textContent=m.name;
 $('dCat').textContent=(GL[m.layer]||'背景慢变量')+' · '+m.id+' · status='+m.status;
 const rows=[
  ['状态',ST_TXT[m.status]+' ('+m.status+')'],
  ['数值',licensed&&m.value?JSON.stringify(m.value):(m.status==='restricted'?'受限不转录':'—')],
  ['单位',m.unit||'—'],
  ['as_of',m.as_of||'—'],
  ['最近尝试',m.last_attempt_at||'—'],
  ['采集时间',m.collected_at||'—'],
  ['源链接',m.source_url||'—'],
  ['跳源链接',m.link_url||'—'],
  ['license',m.license||'—'],
  ['受限原因',m.restricted_reason||'—'],
 ];
 $('dBody').innerHTML=rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');
 openDrawer();
}
async function refresh(){
 if(busy)return;busy=true;const rb=$('rb');rb.disabled=true;rb.textContent='读取中…';
 try{
  let d=null;try{const r=await fetch('preview-data/global.json?t='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}
  if(!d||!Array.isArray(d.metrics)){$('banner').style.display='block';$('banner').textContent='未读取到本地快照 preview-data/global.json';$('st').textContent='快照未加载';$('grid').innerHTML='';$('groups').innerHTML='';return}
  DATA=d;$('banner').style.display='none';
  $('st').textContent='schema '+d.schema_version+' · 生成 '+(d.generated_at||'').slice(0,10)+' · connected '+(d.metrics.filter(m=>m.status==='connected').length)+' 项 · 其余跳源/受限/待接入 · 未自动更新';
  renderGroups();render();
 }finally{busy=false;rb.disabled=false;rb.textContent='重读本地快照'}
}
refresh();
</script></body></html>
