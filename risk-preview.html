<style>
:root{--page:#f5f6f8;--card:#fff;--line:#e6e8ec;--line-2:#f0f1f4;--ink:#1f2733;--ink-2:#4a5260;--muted:#868e9a;--faint:#b0b6bf;--accent:#3d6a9e;--chip:#f2f4f7;--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}

button{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid #e0e5ed;border-radius:14px;height:38px;padding:0 16px;cursor:pointer}

.drawer.open{transform:translateX(0)}
.drawer h3{margin:0 0 2px;font-size:15px;color:var(--ink)}

.drawer dl{margin:14px 0 0;display:grid;grid-template-columns:92px 1fr;gap:10px 12px;font-size:13px}

<script src="https://fastly.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const LAYERS=[['A_macro_rates','宏观利率'],['B_credit','信用'],['C_second_order_vol','二阶波动'],['D_mm_structure','做市结构'],['E_first_order_sentiment','一阶情绪'],['F_price_breadth','价格宽度']];
const GL={};LAYERS.forEach(l=>GL[l[0]]=l[1]);
const CN={
 'A1_move':'MOVE 美债波动率','A2_move_vix_ratio':'MOVE/VIX 比','A3_yield_curve_nominal':'美债名义收益率曲线','A3b_yield_curve_real':'美债实际收益率曲线(TIPS)',
 'B1_hy_oas':'高收益债 OAS','B2_ig_oas':'投资级债 OAS','C1_skew':'CBOE SKEW 偏度','C2_vvix':'VVIX 隐含波动率的波动率','C3_vix_vix3m':'VIX/VIX3M 期限结构','C4_vix9d_vix':'VIX9D/VIX 短期比','C5_pc_63d_vs_skew_5d':'认沽/认购偏度 5 日剪刀差',
 'D1_gex':'Dealer Gamma 敞口','D2_corr_1m':'CBOE 1 个月隐含相关性','D3_vixeq_tech_crowding':'VIXEQ 科技股拥挤度','D4_vxn_term_premium':'VXN 科技股期限溢价',
 'E1_vix':'CBOE VIX','E2_put_call_structure':'认沽/认购结构(指数与个股)','E3_sentiment_surveys':'BofA FMS/AAII/NAAIM 情绪调查','E4_margin_debt_yoy':'FINRA 保证金余额同比','E5_qqq_soxx_shock':'QQQ/SOXX 单日冲击',
 'F1_nvda_vs_ma':'NVDA vs 50/200 日均线','F2_phlx_semis_drawdown':'PHLX 半导体(SOX)回撤','F3_spx_vs_ma':'标普500 vs 50/200 日均线','F4_ew_minus_cw_drag':'等权-市值加权 回撤差','F5_kospi_jpy_carry':'韩股/日元套息 unwind',
 'S1_sahm':'Sahm 规则实时','S2_nfci':'芝加哥联储 NFCI','S3_real_10y':'10Y TIPS 实际利率','S4_term_premium':'ACM 10Y 期限溢价','S5_sofr_iorb':'SOFR-IORB 融资利差','S6_brent':'布伦特原油','S7_cape':'Shiller CAPE'
};
function cnName(m){return CN[m.id]||m.name}
function isLicensed(m){return m.status==='connected'||m.status==='connected_stale'}
 ST_TXT={connected:'已直取',connected_stale:'已直取·陈旧',link_only:'跳源',restricted:'受限',pending:'待接入',missing:'缺数据',failed_no_cache:'读取失败'},
 ST_CLS={connected:'t-connected',connected_stale:'t-stale',link_only:'t-link',restricted:'t-restricted',pending:'t-pending',missing:'t-missing',failed_no_cache:'t-restricted'};
let DATA=null,cur='全部',busy=false,curveChart=null,sparkCharts=[];
function openDrawer(){$('drawer').classList.add('open');$('mask').classList.add('open')}
function closeDrawer(){$('drawer').classList.remove('open');$('mask').classList.remove('open')}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeDrawer()});
$('mask').addEventListener('click',closeDrawer);
function safeUrl(u){if(!u||typeof u!=='string')return null;try{const url=new URL(u);if(!/^https?:$/.test(url.protocol))return null;return url.toString()}catch(e){return null}}
function esc(s){return String(s==null?'—':s)}
function isLicensed(m){return m.status==='connected'||m.status==='connected_stale'}
function shortValue(m){
 const staleMark=m.status==='connected_stale'?'<span style="color:#8a6d2f">陈旧·</span>':'';
 if(isLicensed(m)&&m.value!=null){
  if(typeof m.value==='object'){
   const keys=Object.keys(m.value);
   const ten=(m.value['10 Yr']!=null)?m.value['10 Yr']:'—';
   return staleMark+'名义曲线 '+keys.length+' 段 · 10Y '+ten+'%';
  }
  return staleMark+m.value+(m.unit?' '+m.unit:'');
 }
 if(m.status==='link_only')return '<span style="color:var(--muted)">跳源查看 · 不转录数值</span>';
 if(m.status==='restricted')return '<span style="color:#8a6d2f">ICE 版权受限 · 不转录</span>';
 if(m.status==='pending')return '<span style="color:var(--muted)">待公开源接入</span>';
 if(m.status==='failed_no_cache')return '<span style="color:#8a6d2f">上次读取失败 · 无缓存</span>';
 return '<span style="color:var(--faint)">缺数据 · 不补 0</span>';
}
function rowHtml(m){
 const btn=document.createElement('button');
 btn.className='mrow';btn.dataset.id=m.id;
 btn.innerHTML='<span class="n"></span><span class="v"></span><span class="b"><span class="tag '+ST_CLS[m.status]+'">'+ST_TXT[m.status]+'</span><span style="font-size:10px"></span></span>';
 btn.querySelector('.n').textContent=cnName(m);
 btn.querySelector('.v').innerHTML=shortValue(m);
 btn.querySelector('.b span:last-child').textContent=(m.as_of!=null)?m.as_of:'—';
 return btn;
}
const TENOR_ORDER=['1 Mo','1.5 Month','2 Mo','3 Mo','4 Mo','6 Mo','1 Yr','2 Yr','3 Yr','5 Yr','7 Yr','10 Yr','20 Yr','30 Yr'];
function fmtChange(m){
 const h=m.history;if(!h||h.length<2)return '';
 const last=h[h.length-1].value,prev=h[h.length-2].value;
 if(last==null||prev==null)return '';
 const diff=last-prev;const sign=diff>=0?'+':'';
 const u=(m.unit||'').toLowerCase();
 let u2='';
 if(u.includes('percent')||u==='%')u2='pp';
 else if(u.includes('bp')||u.includes('basis'))u2='bp';
 else if(u.includes('index')||u.includes('vix')||u.includes('corr'))u2='点';
 return sign+diff.toFixed(2)+u2+' ('+(h[h.length-1].date||'').slice(5)+')';
}
let sparkWindow=90;
function renderCurve(){
 const el=$('curve');if(!el||!window.echarts)return;
 const m=DATA.metrics.find(x=>x.id==='A3_yield_curve_nominal');
 if(!m||!isLicensed(m)||typeof m.value!=='object'){el.innerHTML='<div style="padding:20px;color:var(--muted);font-size:13px">名义收益率曲线待官方快照加载</div>';return}
 if(!curveChart)curveChart=echarts.init(el);
 const xs=TENOR_ORDER.filter(k=>m.value[k]!=null);
 const ys=xs.map(k=>m.value[k]);
 curveChart.setOption({backgroundColor:'transparent',animation:false,
  grid:{left:40,right:20,top:30,bottom:30},
  title:{text:'美债名义收益率曲线（%）· as_of '+(m.as_of||'—'),left:4,top:0,textStyle:{fontSize:13,color:'#1f2733',fontWeight:600}},
  tooltip:{trigger:'axis'},
  xAxis:{type:'category',data:xs,axisLabel:{fontSize:10,color:'#868e9a',rotate:30}},
  yAxis:{type:'value',axisLabel:{fontSize:10,color:'#868e9a',formatter:'{value}%'}},
  series:[{type:'line',data:ys,smooth:false,symbol:'circle',symbolSize:5,
   lineStyle:{color:'#3d6a9e',width:2},itemStyle:{color:'#3d6a9e'},
   label:{show:true,fontSize:9,color:'#4a5260',formatter:p=>p.value}}]
 },true);
}
function renderSparks(){
 const holder=$('sparks');if(!holder)return;
 holder.innerHTML='';
 sparkCharts.forEach(c=>{try{c.dispose()}catch(e){}});sparkCharts=[];
 const connected=DATA.metrics.filter(m=>isLicensed(m)&&m.history&&m.history.length>=2&&typeof m.value!=='object');
 if(!connected.length){holder.innerHTML='<div style="padding:14px;color:var(--muted);font-size:12.5px">其他 connected 指标历史待接入（政府真实历史系列写入后自动显示）</div>';return}
 const ctl=document.createElement('div');ctl.style.cssText='width:100%;font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap';
 ctl.appendChild(document.createTextNode('历史窗口：'));
 [30,90,252].forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w+'日';b.style.cssText='height:26px;padding:0 10px;font-size:11px;border-radius:12px;border:1px solid #e0e5ed;background:'+(sparkWindow===w?'#edf3fc':'#fff');b.addEventListener('click',()=>{sparkWindow=w;renderSparks()});ctl.appendChild(b)});
 holder.appendChild(ctl);
 connected.forEach(m=>{
  const hist=m.history.slice(-sparkWindow);
  const card=document.createElement('div');card.style.cssText='background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:200px;flex:1';
  const hdr=document.createElement('div');hdr.style.cssText='font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px';
  const n=document.createElement('span');n.textContent=cnName(m);const ch=document.createElement('span');ch.style.cssText='color:#3d6a9e;font-weight:600';ch.textContent=fmtChange(m);
  hdr.appendChild(n);hdr.appendChild(ch);
  const chEl=document.createElement('div');chEl.style.cssText='height:80px;margin-top:4px';
  card.appendChild(hdr);card.appendChild(chEl);holder.appendChild(card);
  const c=echarts.init(chEl);sparkCharts.push(c);
  c.setOption({backgroundColor:'transparent',animation:false,
   grid:{left:4,right:4,top:6,bottom:4},
   xAxis:{type:'category',data:hist.map(h=>(h.date||'').slice(5)),show:false},
   yAxis:{type:'value',scale:true,axisLabel:{show:false},splitLine:{lineStyle:{color:'#eef1f5'}}},
   series:[{type:'line',data:hist.map(h=>h.value),symbol:'none',lineStyle:{color:'#3d6a9e',width:1.5},areaStyle:{color:'rgba(61,106,158,.08)'}}]
  });
 });
}
const PANEL_Q={
 A_macro_rates:'回答：美债利率期限结构当前形态（已直取名义曲线）。',
 B_credit:'回答：信用利差与 CDS 当前水平（多数源受限/跳源，不转录数值）。',
 C_second_order_vol:'回答：偏度与波动率的波动率等二阶指标（跳源查看）。',
 D_mm_structure:'回答：做市商 Gamma 敞口与相关性（跳源查看）。',
 E_first_order_sentiment:'回答：VIX、认沽认购、情绪调查等一阶情绪（跳源/待接入）。',
 F_price_breadth:'回答：趋势宽度与跨市场 unwind 信号（跳源查看）。',
 S_slow_variables:'慢变量：月频/季频背景，不做当日评分。'
};
function render(){
 if(!DATA)return;
 renderCurve();
 const main=DATA.metrics.filter(m=>m.layer!=='S_slow_variables');
 const list=cur==='全部'?main:main.filter(m=>m.layer===LAYERS.find(l=>GL[l[0]]===cur)[0]);
 const grid=$('grid');grid.innerHTML='';
 LAYERS.filter(l=>cur==='全部'||GL[l[0]]===cur).forEach(l=>{
  const items=list.filter(m=>m.layer===l[0]);if(!items.length)return;
  const sec=document.createElement('section');sec.className='panel';
  sec.innerHTML='<div class="panel-head"><span class="t"></span><span class="c"></span></div><div style="padding:6px 14px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line-2)"></div>';
  sec.querySelector('.t').textContent=GL[l[0]];
  sec.querySelector('.c').textContent=items.length+' 项';
  sec.querySelector('.panel-head + div').textContent=PANEL_Q[l[0]]||'';
  items.forEach(m=>sec.appendChild(rowHtml(m)));
  grid.appendChild(sec);
 });
 if(cur==='全部'){
  const slow=DATA.metrics.filter(m=>m.layer==='S_slow_variables');
  if(slow.length){
   const sec=document.createElement('section');sec.className='panel';sec.style.gridColumn='1/-1';
   sec.innerHTML='<div class="panel-head"><span class="t">背景慢变量</span><span class="c"></span></div><div style="padding:6px 14px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line-2)">'+PANEL_Q.S_slow_variables+'</div>';
   sec.querySelector('.c').textContent=slow.length+' 项';
   slow.forEach(m=>sec.appendChild(rowHtml(m)));
   grid.appendChild(sec);
  }
 }
 grid.querySelectorAll('.mrow').forEach(b=>b.addEventListener('click',()=>openDetail(b.dataset.id)));
}
function renderGroups(){
 const counts={};DATA.metrics.forEach(m=>{if(m.layer!=='S_slow_variables')counts[m.layer]=(counts[m.layer]||0)+1});
 $('groups').innerHTML='';
 ['全部'].concat(LAYERS.map(l=>GL[l[0]])).forEach(g=>{
  const layer=LAYERS.find(l=>GL[l[0]]===g);
  const c=g==='全部'?DATA.metrics.length:(counts[layer[0]]||0);
  const b=document.createElement('button');b.type='button';b.className='gchip'+(g===cur?' on':'');b.textContent=g+' ('+c+')';
  b.addEventListener('click',()=>{cur=g;renderGroups();render()});
  $('groups').appendChild(b);
 });
}
function openDetail(id){
 const m=DATA.metrics.find(x=>x.id===id);if(!m)return;
 $('dName').textContent=m.name;
 $('dCat').textContent=(GL[m.layer]||'背景慢变量')+' · '+m.id+' · status='+m.status;
 const body=$('dBody');body.innerHTML='';
 const add=(k,v,isLink)=>{
  const dt=document.createElement('dt');dt.textContent=k;
  const dd=document.createElement('dd');
  if(isLink&&safeUrl(v)){const a=document.createElement('a');a.href=safeUrl(v);a.target='_blank';a.rel='noopener noreferrer';a.textContent=v;dd.appendChild(a)}
  else dd.textContent=esc(v);
  body.appendChild(dt);body.appendChild(dd);
 };
 add('状态',ST_TXT[m.status]+' ('+m.status+')');
 add('数值',isLicensed(m)&&m.value!=null?JSON.stringify(m.value):(m.status==='restricted'?'受限不转录':'—'));
 add('单位',m.unit);
 add('as_of',m.as_of);
 add('最近尝试',m.last_attempt_at);
 add('采集时间',m.collected_at);
 add('源链接',m.source_url,true);
 add('跳源链接',m.link_url,true);
 add('license',m.license);
 add('受限原因',m.restricted_reason);
 openDrawer();
}
async function refresh(){
 if(busy)return;busy=true;const rb=$('rb');rb.disabled=true;rb.textContent='读取中…';
 try{
  let d=null;try{const r=await fetch('preview-data/global.json?t='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}
  if(!d||!Array.isArray(d.metrics)){$('banner').style.display='block';$('banner').textContent='未读取到本地快照 preview-data/global.json';$('st').textContent='快照未加载';$('grid').innerHTML='';$('groups').innerHTML='';return}
  DATA=d;$('banner').style.display='none';
  let lastRun='—';try{const sr=await fetch('preview-data/status.json?t='+Date.now(),{cache:'no-store'});if(sr.ok){const sj=await sr.json();const t=sj.last_run||sj.generated_at;if(t)lastRun=t.slice(0,16).replace('T',' ')}}catch(e){}
  $('st').textContent='schema '+d.schema_version+' · 生成 '+(d.generated_at||'').slice(0,10)+' · 预览任务已运行 '+lastRun+' · connected '+(d.metrics.filter(m=>m.status==='connected').length)+' 项 · 其余跳源/受限/待接入';
  renderGroups();renderCurve();renderSparks();render();
 }finally{busy=false;rb.disabled=false;rb.textContent='重读本地快照'}
}
refresh();
window.addEventListener('resize',()=>{if(curveChart)curveChart.resize()});
</script></body></html>
