<style>
:root{
 --page:#f5f6f8;--card:#fff;--line:#e6e8ec;--line-2:#f0f1f4;
 --ink:#1f2733;--ink-2:#4a5260;--muted:#868e9a;--faint:#b0b6bf;
 --accent:#3d6a9e;--accent-bg:#edf2f8;--chip:#f2f4f7;
 --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink-2);font:14px/1.55 var(--font);font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid #9fb6d3;outline-offset:2px}
.wrap{max-width:1600px;margin:0 auto;padding:0 14px}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:7px;background:var(--accent-bg);display:grid;place-items:center;flex:none}
h1{margin:0;font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.crumb{font-size:12px;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid #d9dde3;border-radius:6px;height:34px;padding:0 12px;cursor:pointer}
button:hover{border-color:#b3bcc8}button:disabled{color:var(--muted);cursor:default}
.tab{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--ink-2)}
.tab:hover{background:var(--chip);text-decoration:none}
.sec{margin:16px 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
h2{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
#st{display:block;margin-top:14px;font-size:12px;color:var(--muted)}
details.note{position:relative;flex:0 0 auto;margin-left:auto;font-size:12px;color:var(--muted)}
details.note summary{cursor:pointer;list-style:none;display:block;white-space:nowrap;border-radius:4px}
details.note summary::-webkit-details-marker{display:none}
details.note summary span{color:var(--accent)}
details.note p{position:absolute;right:0;top:100%;z-index:20;width:min(520px,calc(100vw - 48px));max-height:60vh;overflow:auto;margin:8px 0 0;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(31,39,51,.10);line-height:1.75;color:var(--ink-2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px;padding:10px 6px 0}
#ch{height:calc(100vh - 210px);min-height:440px}
.foot{padding:9px 10px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2)}
.share-status{position:fixed;right:20px;bottom:20px;z-index:60;max-width:min(420px,calc(100vw - 40px));padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);box-shadow:0 4px 18px rgba(31,39,51,.10);font-size:14px}
.share-status:empty{display:none}
.share-fallback{position:fixed;right:20px;bottom:110px;z-index:60;max-width:calc(100vw - 40px);padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:14px}
.share-fallback[hidden]{display:none}
@media(min-width:700px){.wrap{padding:0 24px}.panel{padding:12px 12px 0}}
/* 数据视图切换与操作分层；圆润页签只承担导航，不混在刷新按钮中。 */
.top .nav-row{padding-top:0;padding-bottom:12px}
.view-tabs{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid #e7ebf0;border-radius:18px;background:#f4f6f9}
.view-tab{display:flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 19px;border-radius:14px;color:#7b8492;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}
.view-tab:hover{background:#e9edf4;color:#4c678e;text-decoration:none}
.view-tab[aria-current="page"]{background:#fff;color:#3f6baf;box-shadow:0 1px 4px rgba(39,63,101,.09);font-weight:600}
.view-tab svg{width:16px;height:16px;flex:none}
.mark{width:38px;height:38px;border-radius:0;background:transparent;display:block;flex:none}
.mark svg{display:block;width:38px;height:38px}
button,select{border-radius:14px;height:38px;padding:0 16px;border-color:#e0e5ed;box-shadow:0 1px 2px rgba(31,39,51,.025)}
button:hover,select:hover{background:#f8faff;border-color:#bccce1}
#shareBtn{background:#edf3fc;border-color:#dfE9f7;color:#416698;font-weight:500}
#shareBtn:hover{background:#e5eefb;border-color:#c8daf2}
#shareBtn:disabled{color:#8b9caf;opacity:.8}
.ctl label{gap:8px}
.share-fallback{border-radius:14px}
/* 预览标识：仅预览环境出现 */
.pv-chip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:500;color:#8a6d2f;background:#fdf3e0;border:1px solid #ecd9a6;vertical-align:middle;white-space:nowrap}
@media(max-width:699px){
 .brand{gap:8px}h1{font-size:16px}
 .top .nav-row{padding-top:0;padding-bottom:10px}
 .view-tabs{display:flex;width:100%;max-width:none;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .view-tabs::-webkit-scrollbar{display:none}
 .view-tab{flex:none;min-height:40px;padding:0 14px}
 .view-tab svg{display:none}
 .ctl{gap:8px}select{min-width:120px}
}

/* ===== Unified dashboard UI v1: common geometry across all four tabs ===== */
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
body.ui-page{margin:0;overflow-x:visible;color:#4a5260;background:#f5f6f8;font:14px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ui-page .wrap{width:100%;max-width:1600px;margin:0 auto;padding-left:24px;padding-right:24px}
.ui-page .top{background:#fff;border-bottom:1px solid #e6e8ec}
.ui-page .top .shell-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;height:72px;padding-top:14px;padding-bottom:14px}
.ui-page .brand{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:10px;min-width:0;height:44px}
.ui-page .mark,.ui-page .mark svg{display:block;width:38px;height:38px;flex:none;border-radius:0;background:transparent}
.ui-page .brand-copy{min-width:0}
.ui-page h1{margin:0;font-size:18px;font-weight:600;line-height:26px;color:#1f2733;white-space:nowrap}
.ui-page .crumb{font-size:12px;line-height:18px;color:#868e9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-page .pv-chip{display:inline-block;margin-left:8px;vertical-align:2px;font-size:11px;line-height:16px;height:20px;padding:1px 7px;border-radius:8px;background:#fdf3e0;border:1px solid #ecd9a6;color:#8a6d2f;font-weight:500;white-space:nowrap}
.ui-page .ctl{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:8px;height:44px;min-width:0}
.ui-page .ctl label{display:flex;align-items:center;gap:6px;font-size:13px;color:#868e9a;white-space:nowrap}
.ui-page button:not(.mrow),.ui-page select{box-sizing:border-box;font-family:inherit;font-size:14px!important;line-height:22px;height:44px!important;min-width:44px;padding:0 16px!important;border:1px solid #e0e5ed!important;border-radius:14px!important;background:#fff;color:#1f2733;box-shadow:0 1px 2px rgba(31,39,51,.025);cursor:pointer;vertical-align:middle}
.ui-page select{max-width:100%;min-width:132px}
.ui-page button:not(.mrow):hover,.ui-page select:hover{background:#f8faff;border-color:#bccce1!important}
.ui-page button:disabled{opacity:.65;cursor:default;color:#868e9a}
.ui-page button.on,.ui-page .gchip.on,.ui-page .chip.on{background:#edf3fc;border-color:#c8daf2!important;color:#3f6baf;font-weight:600}
.ui-page #shareBtn{background:#edf3fc;border-color:#dfe9f7!important;color:#416698;font-weight:500}
.ui-page :focus-visible{outline:2px solid #9fb6d3;outline-offset:2px}
.ui-page .top .nav-row{display:block;height:64px;padding-top:0;padding-bottom:12px}
.ui-page .view-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;width:528px;max-width:100%;height:52px;gap:4px;padding:4px;border:1px solid #e7ebf0;border-radius:18px;background:#f4f6f9;overflow:visible}
.ui-page .view-tab{display:flex;flex:none;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:42px;height:42px;padding:0 10px;border-radius:14px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;color:#7b8492;text-decoration:none}
.ui-page .view-tab svg{display:block;width:16px;height:16px;flex:none}
.ui-page .view-tab:hover{background:#e9edf4;color:#4c678e;text-decoration:none}
.ui-page .view-tab[aria-current="page"]{background:#fff;color:#3f6baf;box-shadow:0 1px 4px rgba(39,63,101,.09);font-weight:600}
.ui-page main.wrap{padding-top:20px;padding-bottom:32px}
.ui-page .sec{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;min-height:32px;margin:24px 0 12px}
.ui-page main>.sec:first-child{margin-top:0}
.ui-page h2{margin:0;font-size:15px;font-weight:600;line-height:24px;color:#1f2733}
.ui-page .sec .side,.ui-page #st{font-size:12px;line-height:20px;color:#868e9a;min-width:0}
.ui-page .sec #st{margin:0;max-width:calc(100% - 180px)}
.ui-page .panel{border:1px solid #e6e8ec;border-radius:10px;background:#fff;margin-bottom:24px}
.ui-page .panel-head{padding:12px 16px;min-height:48px;gap:8px}
.ui-page .panel-head .t{font-size:14px;line-height:22px}
.ui-page .foot{font-size:12px;line-height:20px;padding:10px 16px 12px;color:#868e9a}
.ui-page .kpis{grid-template-columns:repeat(2,minmax(0,1fr));border-radius:10px}
.ui-page .kpi{padding:12px 16px;min-width:0}
.ui-page .kpi:only-child{grid-column:1/-1}
.ui-page .kpi .lb{font-size:12px;line-height:18px;color:#868e9a}
.ui-page .kpi .vl{font-size:24px;line-height:30px;margin-top:2px}
.ui-page .kpi .vl small{font-size:13px;font-weight:400;color:#868e9a}
.ui-page .kpi .ft{font-size:12px;line-height:20px;margin-top:3px;white-space:normal;overflow:visible;text-overflow:clip}
.ui-page table{font-size:14px}
.ui-page th,.ui-page td{padding:10px 16px;line-height:22px}
.ui-page th{font-size:12px;font-weight:500}
.ui-page .tbx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ui-page .ctl-row{padding:12px 16px;gap:8px;border:1px solid #e6e8ec;border-radius:10px;background:#fff}
.ui-page .ctl-row label{font-size:13px;line-height:22px}
.ui-page .filter-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.ui-page .filter-group label{flex:none}
.ui-page .groups{gap:8px;margin:12px 0}
.ui-page .mrow{padding:12px 16px;min-height:76px;border-radius:0;box-shadow:none}
.ui-page .mrow .n{font-size:14px;line-height:22px}
.ui-page .mrow .v{font-size:13px;line-height:20px}
.ui-page button.guide-link{display:flex;height:auto!important;min-height:44px;padding:10px 16px!important;line-height:22px}
.ui-page .guide-link .gl-l b{font-size:14px}
.ui-page .guide-link .gl-l span,.ui-page .guide-link .gl-r{font-size:13px}
.ui-page[data-ui-view="margin"] .panel{padding:12px 12px 0}
.ui-page[data-ui-view="margin"] #ch{height:calc(100vh - 266px);min-height:440px}
.ui-page #sparks>div[style*="display:grid"]{gap:12px!important}
.ui-page #sparks button{font-size:13px!important}
.ui-page #sparks>div[style*="display:grid"]>div{padding:16px!important;border-radius:10px!important}
.ui-page .ui-mask{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.ui-page .ui-mask[hidden]{display:none}

<script>
function openMarginGuide(){uiPanel.open('marginGuide')}

let shareInProgress=false,shareDownloadURL=null,shareStatusTimer=null;
function shareNotice(text){clearTimeout(shareStatusTimer);document.getElementById('shareStatus').textContent=text;shareStatusTimer=setTimeout(()=>{document.getElementById('shareStatus').textContent=''},12000)}
function showShareDownload(blob){
 if(shareDownloadURL)URL.revokeObjectURL(shareDownloadURL);
 shareDownloadURL=URL.createObjectURL(blob);
 const link=document.getElementById('shareDownload');link.href=shareDownloadURL;link.download='两融余额-指数对比.png';link.hidden=false;

async function renderMarginImage(option,status){
 // 只复制已显示的配置/日期范围/图例状态，不额外取数据，不改变原图。
 const host=document.createElement('div');host.style.cssText='position:fixed;left:-100000px;top:0;width:1230px;height:560px;pointer-events:none';host.setAttribute('aria-hidden','true');document.body.appendChild(host);
 let chart;
 try{
  if(document.fonts)await Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,2000))]);
  chart=echarts.init(host,null,{renderer:'canvas',devicePixelRatio:2});
  chart.setOption({...option,animation:false,tooltip:{show:false}},true);
  const image=new Image();image.src=chart.getDataURL({type:'png',pixelRatio:2,backgroundColor:'#fff',excludeComponents:['tooltip']});await image.decode();
  const canvas=document.createElement('canvas');canvas.width=2560;canvas.height=1392;
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('图片画布不可用');ctx.scale(2,2);
  ctx.fillStyle='#f5f6f8';ctx.fillRect(0,0,1280,696);
  const font=getComputedStyle(document.body).fontFamily;
  ctx.fillStyle='#1f2733';ctx.font='600 18px '+font;ctx.fillText('两融余额 · 指数对比',24,34);
  ctx.fillStyle='#868e9a';ctx.font='12px '+font;ctx.fillText(status,24,58);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(24,76,1232,586,10);ctx.fill();
  ctx.drawImage(image,25,88,1230,560);
  ctx.fillStyle='#868e9a';ctx.font='12px '+font;ctx.fillText('日频收盘数据 · 两融余额：亿元（左轴）；指数：点位，对数刻度（右轴） · 当前显示范围',24,682);
  return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('PNG编码失败')),'image/png'));
 }finally{if(chart&&!chart.isDisposed())chart.dispose();host.remove()}
}
async function copyMarginImage(){
 if(shareInProgress)return;
 const chart=echarts.getInstanceByDom(document.getElementById('ch'));
 if(!chart||!chart.getOption().series?.length){shareNotice('页面正在加载，请等数据加载完成后再复制。');return}
 shareInProgress=true;const button=document.getElementById('shareBtn');button.disabled=true;button.textContent='正在复制…';document.getElementById('shareDownload').hidden=true;
 if(shareDownloadURL){URL.revokeObjectURL(shareDownloadURL);shareDownloadURL=null}
 let pngPromise;
 try{
  pngPromise=renderMarginImage(chart.getOption(),document.getElementById('st').textContent);pngPromise.catch(()=>{});
  if(!window.isSecureContext||!navigator.clipboard?.write||!window.ClipboardItem||(ClipboardItem.supports&&!ClipboardItem.supports('image/png'))){showShareDownload(await pngPromise);shareNotice('当前浏览器不支持复制图片，可点击“保存图片”备用。');return}
  await navigator.clipboard.write([new ClipboardItem({'image/png':pngPromise})]);shareNotice('整张图片已复制，可切换窗口按 ⌘V / Ctrl+V 粘贴。');
 }catch(error){
  let blob=null;try{if(pngPromise)blob=await pngPromise}catch(captureError){error=captureError}
  if(blob){showShareDownload(blob);shareNotice('浏览器未允许复制。请允许剪贴板权限后重试，或点击“保存图片”。')}
  else shareNotice('未能生成图片，请稍后重试。'+(error instanceof Error?error.message:''));
 }finally{shareInProgress=false;button.disabled=false;button.textContent='复制为图片'}
}
</script>

/* ===== Unified dashboard dialogs and route continuity ===== */
window.uiPanel=(()=>{
 let active=null;
 function close(){
  if(!active)return;const state=active;active=null;
  state.node.hidden=true;document.body.style.overflow=state.overflow;
  state.inert.forEach(item=>{item.el.inert=item.was});
  if(state.focus&&state.focus.isConnected)state.focus.focus();
 }
 function open(id){
  const node=document.getElementById(id);if(!node)return;
  if(active&&active.node===node)return;if(active)close();
  active={node,focus:document.activeElement,overflow:document.body.style.overflow,inert:[]};
  for(const el of [document.querySelector('header.top'),document.querySelector('main')].filter(Boolean)){
   active.inert.push({el,was:el.inert});el.inert=true;
  }
  node.hidden=false;document.body.style.overflow='hidden';
  const body=node.querySelector('.ui-modal-body');if(body)body.scrollTop=0;
  const focus=node.querySelector('button.ui-close');if(focus)focus.focus();
 }
 document.addEventListener('keydown',event=>{
  if(!active)return;
  if(event.key==='Escape'){event.preventDefault();close();return}
  if(event.key!=='Tab')return;
  const focusable=[...active.node.querySelectorAll('button,a[href],input,select,textarea,[tabindex]')].filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);
  if(!focusable.length){event.preventDefault();return}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
 });
 // Preserve an explicit version query across the four links so a user who
 // opens the delivered cache-busting URL does not return to older tab HTML.
 const version=new URLSearchParams(location.search).get('v');
 if(version&&/^[A-Za-z0-9_-]{1,64}$/.test(version))document.querySelectorAll('.view-tab').forEach(link=>{
  const url=new URL(link.getAttribute('href'),location.href);url.searchParams.set('v',version);link.href=url.href;
 });
 return {open,close};
})();
/* ===== End unified dashboard UI behavior ===== */
