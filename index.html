<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>国家队·分时八宫格</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{margin:0;background:#0f1115;color:#d8dbe2;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px 18px;border-bottom:1px solid #222}h1{margin:0 12px 0 0;font-size:20px;display:inline}#st{margin-left:10px;font-size:13px;color:#9aa}
.note{font-size:12px;color:#889;margin-top:6px}button,select{margin-left:8px;background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:3px 10px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}@media(max-width:1100px){.g{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.g{grid-template-columns:1fr}}
.c{background:#161a21;border:1px solid #262b35;border-radius:8px;padding:8px;position:relative}.t{font-size:14px;font-weight:600}.t b{color:#ff5b5b;margin-left:6px}.ch{height:330px}
.na{position:absolute;inset:40px 8px 8px;display:flex;align-items:center;justify-content:center;color:#889;font-size:13px;text-align:center}
#banner{display:none;margin:10px 10px 0;padding:8px 12px;border:1px solid #6b5a1e;background:#2a2412;border-radius:6px;font-size:13px}
.tw{padding:0 10px 20px}h2{font-size:16px;margin:10px 0}table{border-collapse:collapse;width:100%;max-width:760px;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid #262b35;text-align:right}th:first-child,td:first-child{text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:#1d222c}tr.sel{background:#232a38}.up{color:#ff4d4f}.dn{color:#26a65b}</style></head><body>
<header><h1>国家队 · 分时八宫格</h1>日期<select id="ds"><option value="live">今日实时</option></select><button id="rb" onclick="refresh()">手动刷新</button><span id="st">加载中…</span>
<div class="note">红柱 = 单分钟成交额 &gt; 1 亿；救市金额估算 = 当日红柱成交额合计；MACD(12,26,9)。仅「今日实时」每 60 秒自动刷新，历史日为存档静态数据。⚠ 这是成交额阈值代理，非官方国家队认定，也不是监管披露的护盘资金。数据：腾讯行情。</div></header>
<div id="banner"></div>
<div class="g" id="g"></div>
<div class="tw"><h2>日度汇总</h2><table><thead><tr><th>日期</th><th>估算合计(亿)</th><th>上证收盘</th><th>上证涨跌幅</th><th>简评</th></tr></thead><tbody id="tb"></tbody></table>
<div class="note">点击一行切换到该日。历史只含已归档日期（data/history.json），不补造。</div></div>
<script>
const E=[["上证50","sh510050"],["沪深300","sh510300"],["中证A500","sz159352"],["中证500","sh510500"],["中证1000","sh512100"],["创业板","sz159915"],["科创50","sh588000"]];
const KEY="nt-octagon-history",COL=["#ff4d4f","#1890ff","#faad14","#13c2c2","#722ed1","#fa8c16","#52c41a"];
const g=document.getElementById("g"),charts=[],sel=document.getElementById("ds");let H={},view="live",busy=false,SSEK=null;
E.concat([["上证指数 · 救市金额估算","sum"]]).forEach((e,i)=>{g.insertAdjacentHTML("beforeend",'<div class="c"><div class="t" id="t'+i+'">'+e[0]+'</div><div class="ch" id="c'+i+'"></div><div class="na" id="n'+i+'" style="display:none"></div></div>');charts.push(echarts.init(document.getElementById("c"+i),"dark"))});
addEventListener("resize",()=>charts.forEach(c=>c.resize()));
const ema=(a,n)=>{const k=2/(n+1),o=[];a.forEach((v,i)=>o.push(i?v*k+o[i-1]*(1-k):v));return o};
const bj=()=>new Date(Date.now()+(new Date().getTimezoneOffset()+480)*6e4);
function trading(){const d=bj(),w=d.getDay(),m=d.getHours()*60+d.getMinutes();return w>0&&w<6&&((m>=570&&m<=690)||(m>=780&&m<=900))}
async function j(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function liveEtf(code){const d=(await j("https://web.ifzq.gtimg.cn/appstock/app/minute/query?code="+code)).data[code].data;let pa=0;const t=[],p=[],a=[];
 d.data.forEach(s=>{const r=s.split(" ");t.push(r[0]);p.push(+r[1]);const am=+r[3];a.push((am-pa)/1e8);pa=am});return {date:d.date,t,p,a}}
function drawEtf(i,m){const [n,code]=E[i];document.getElementById("n"+i).style.display="none";const t=m.t.map(s=>s.slice(0,2)+":"+s.slice(2)),p=m.p,a=m.a;
 const est=a.reduce((s,v)=>v>1?s+v:s,0),e12=ema(p,12),e26=ema(p,26),dif=p.map((v,k)=>e12[k]-e26[k]),dea=ema(dif,9),mac=dif.map((v,k)=>2*(v-dea[k]));
 document.getElementById("t"+i).innerHTML=n+" "+code.slice(2)+"<b>估算 "+est.toFixed(2)+"亿</b>";
 const ax=k=>({type:"category",data:t,gridIndex:k,axisLabel:{show:k==2,fontSize:10},axisTick:{show:false}});
 charts[i].setOption({backgroundColor:"transparent",animation:false,tooltip:{trigger:"axis"},axisPointer:{link:[{xAxisIndex:"all"}]},
  grid:[{top:8,height:"38%",left:44,right:8},{top:"46%",height:"24%",left:44,right:8},{top:"74%",height:"18%",left:44,right:8}],
  xAxis:[ax(0),ax(1),ax(2)],yAxis:[{scale:true,gridIndex:0,splitLine:{lineStyle:{color:"#2a2f3a"}},axisLabel:{fontSize:10}},{gridIndex:1,splitLine:{show:false},axisLabel:{fontSize:10,formatter:"{value}亿"}},{gridIndex:2,splitLine:{show:false},axisLabel:{fontSize:9}}],
  series:[{name:"价格",type:"line",data:p,showSymbol:false,lineStyle:{color:"#4d8dff",width:1.3}},
  {name:"成交额(亿)",type:"bar",xAxisIndex:1,yAxisIndex:1,data:a.map(v=>({value:+v.toFixed(3),itemStyle:{color:v>1?"#ff4d4f":"#6b7280"}})),markLine:{symbol:"none",silent:true,label:{show:false},lineStyle:{color:"#ff4d4f",type:"dashed"},data:[{yAxis:1}]}},
  {name:"MACD",type:"bar",xAxisIndex:2,yAxisIndex:2,data:mac.map(v=>({value:+v.toFixed(5),itemStyle:{color:v>=0?"#ff4d4f":"#26a65b"}}))},
  {name:"DIF",type:"line",xAxisIndex:2,yAxisIndex:2,data:dif.map(v=>+v.toFixed(5)),showSymbol:false,lineStyle:{color:"#f5a623",width:1}},
  {name:"DEA",type:"line",xAxisIndex:2,yAxisIndex:2,data:dea.map(v=>+v.toFixed(5)),showSymbol:false,lineStyle:{color:"#9b6bff",width:1}}]},true);return est}
function noMin(i,est){const [n,code]=E[i];charts[i].clear();document.getElementById("t"+i).innerHTML=n+" "+code.slice(2)+(est!=null?"<b>估算 "+(+est).toFixed(2)+"亿</b>":"");const x=document.getElementById("n"+i);x.style.display="flex";x.textContent="该日分时未存档，仅显示汇总估算"}
async function sseRows(){if(!SSEK||view=="live"){const k=(await j("https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get?param=sh000001,day,,,60,qfq")).data.sh000001;SSEK=(k.day||k.qfqday)}return SSEK}
function drawSum(rows,cur){const r=rows.filter(x=>x[0]>="2026-10-15"),ds=r.map(x=>x[0]);const tot=H[cur]&&H[cur]["合计"];
 document.getElementById("t7").innerHTML="上证指数 · 救市金额估算"+(tot!=null?"<b>"+cur.slice(5)+" "+(+tot).toFixed(2)+"亿</b>":"");
 charts[7].setOption({backgroundColor:"transparent",animation:false,tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:10},itemWidth:10,itemHeight:8},grid:{top:48,left:46,right:44,bottom:28},
  xAxis:{type:"category",data:ds.map(s=>s.slice(5)),axisLabel:{fontSize:10}},yAxis:[{scale:true,splitLine:{lineStyle:{color:"#2a2f3a"}},axisLabel:{fontSize:10}},{name:"亿",splitLine:{show:false},axisLabel:{fontSize:10}}],
  series:[{name:"上证指数",type:"line",data:r.map(x=>({value:+x[2],symbolSize:x[0]==cur?10:5})),lineStyle:{color:"#e6e6e6"},itemStyle:{color:"#e6e6e6"},z:5}].concat(E.map((e,i)=>({name:e[0],type:"bar",stack:"r",yAxisIndex:1,itemStyle:{color:COL[i]},data:ds.map(d=>{const x=H[d];return x&&x[e[0]]!=null?+(+x[e[0]]).toFixed(2):null})})))},true)}
function table(cur){const tb=document.getElementById("tb");tb.innerHTML="";Object.keys(H).sort().reverse().forEach(d=>{const h=H[d],c=h["上证涨跌幅"],tr=document.createElement("tr");if(d==cur)tr.className="sel";
 tr.innerHTML="<td>"+d+"</td><td>"+(h["合计"]!=null?(+h["合计"]).toFixed(2):"-")+"</td><td>"+(h["上证收盘"]!=null?(+h["上证收盘"]).toFixed(2):"-")+"</td><td class='"+(c>0?"up":c<0?"dn":"")+"'>"+(c!=null?(c>0?"+":"")+(+c).toFixed(2)+"%":"-")+"</td><td class='"+(c>0?"up":c<0?"dn":"")+"'>"+(c==null?"-":c>0?"涨":c<0?"跌":"平")+"</td>";
 tr.onclick=()=>{const live=todayStr();sel.value=d==live?"live":d;onSel()};tb.appendChild(tr)})}
let TODAY=null;const todayStr=()=>TODAY;
function fillSel(){const v=sel.value;sel.innerHTML='<option value="live">今日实时</option>'+Object.keys(H).sort().reverse().filter(d=>d!=TODAY).map(d=>'<option value="'+d+'">'+d+'</option>').join("");sel.value=[...sel.options].some(o=>o.value==v)?v:"live"}
async function loadHist(){let r={};try{r=await j("./data/history.json")}catch(e){}let l={};try{l=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}H=Object.assign({},l,r)}
async function refresh(){if(busy)return;busy=true;const rb=document.getElementById("rb"),st=document.getElementById("st"),bn=document.getElementById("banner");rb.disabled=true;rb.textContent="刷新中…";
 try{const rows=await sseRows();
  if(view=="live"){bn.style.display="none";const ms=await Promise.all(E.map(e=>liveEtf(e[1])));const d=ms[0].date;TODAY=d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6);
   const o={};let s=0;ms.forEach((m,i)=>{const v=drawEtf(i,m);o[E[i][0]]=+v.toFixed(2);s+=v});o["合计"]=+s.toFixed(2);
   const ix=rows.findIndex(x=>x[0]==TODAY);if(ix>0){o["上证收盘"]=+rows[ix][2];o["上证涨跌幅"]=+((rows[ix][2]/rows[ix-1][2]-1)*100).toFixed(2)}
   H[TODAY]=Object.assign({},H[TODAY]||{},o);let l={};try{l=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}l[TODAY]=H[TODAY];try{localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}
   fillSel();drawSum(rows,TODAY);table(TODAY);st.textContent="最后刷新 "+bj().toLocaleString("zh-CN",{hour12:false})+"（北京时间）· "+(trading()?"交易中":"非交易时段")+" · 每60秒刷新"}
  else{const d=view,h=H[d]||{};let m=null;try{m=await j("./data/minutes/"+d+".json")}catch(e){}
   E.forEach((e,i)=>{const x=m&&m.etfs[e[1]];x?drawEtf(i,x):noMin(i,h[e[0]])});
   if(!m){bn.style.display="block";bn.textContent=d+"：分时未存档，仅显示汇总数字（合计 "+(h["合计"]!=null?(+h["合计"]).toFixed(2)+" 亿":"无")+"）。"}else bn.style.display="none";
   drawSum(rows,d);table(d);st.textContent="查看存档 "+d+" · 静态数据，不自动刷新"}
 }catch(e){st.textContent="刷新失败："+e.message+(view=="live"?"，60秒后重试":"")}finally{busy=false;rb.disabled=false;rb.textContent="手动刷新"}}
function onSel(){view=sel.value;refresh()}sel.onchange=onSel;
(async()=>{await loadHist();fillSel();await refresh();setInterval(()=>{if(view=="live")refresh()},60000)})();
</script></body></html>
