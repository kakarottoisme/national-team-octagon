<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>国家队·分时八宫格</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{margin:0;background:#0f1115;color:#d8dbe2;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px 18px;border-bottom:1px solid #222}h1{margin:0;font-size:20px;display:inline}#st{margin-left:12px;font-size:13px;color:#9aa}
.note{font-size:12px;color:#889;margin-top:6px}button{margin-left:10px;background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:3px 10px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}@media(max-width:1100px){.g{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.g{grid-template-columns:1fr}}
.c{background:#161a21;border:1px solid #262b35;border-radius:8px;padding:8px}.t{font-size:14px;font-weight:600}.t b{color:#ff5b5b;margin-left:6px}.ch{height:330px}</style></head><body>
<header><h1>国家队 · 分时八宫格</h1><span id="st">加载中…</span><button id="rb" onclick="refresh()">手动刷新</button>
<div class="note">红柱 = 单分钟成交额 &gt; 1 亿；救市金额估算 = 当日红柱成交额合计；MACD(12,26,9)。每 60 秒自动刷新。⚠ 这是成交额阈值代理，非官方国家队认定，也不是监管披露的护盘资金。数据：腾讯行情。</div></header>
<div class="g" id="g"></div>
<script>
const E=[["上证50","sh510050"],["沪深300","sh510300"],["中证A500","sz159352"],["中证500","sh510500"],["中证1000","sh512100"],["创业板","sz159915"],["科创50","sh588000"]];
const SEED={"2026-11-02": {"上证50": 0, "沪深300": 54.29, "中证A500": 1.28, "中证500": 41.86, "中证1000": 39.15, "创业板": 42.63, "科创50": 64.52}}, KEY="nt-octagon-history", COL=["#ff4d4f","#1890ff","#faad14","#13c2c2","#722ed1","#fa8c16","#52c41a"];
const g=document.getElementById("g"),charts=[];
E.concat([["上证指数 · 救市金额估算","sum"]]).forEach((e,i)=>{g.insertAdjacentHTML("beforeend",'<div class="c"><div class="t" id="t'+i+'">'+e[0]+'</div><div class="ch" id="c'+i+'"></div></div>');charts.push(echarts.init(document.getElementById("c"+i),"dark",{renderer:"canvas"}))});
addEventListener("resize",()=>charts.forEach(c=>c.resize()));
const ema=(a,n)=>{const k=2/(n+1),o=[];a.forEach((v,i)=>o.push(i?v*k+o[i-1]*(1-k):v));return o};
function hist(){let h={};try{h=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}return Object.assign({},SEED,h)}
function bj(){return new Date(Date.now()+(new Date().getTimezoneOffset()+480)*6e4)}
function trading(){const d=bj(),w=d.getDay(),m=d.getHours()*60+d.getMinutes();return w>0&&w<6&&((m>=570&&m<=690)||(m>=780&&m<=900))}
async function j(u){const r=await fetch(u,{cache:"no-store"});return r.json()}
async function etf(i){const [n,code]=E[i];const d=(await j("https://web.ifzq.gtimg.cn/appstock/app/minute/query?code="+code)).data[code].data;
 let pa=0;const t=[],p=[],a=[];d.data.forEach(s=>{const r=s.split(" ");t.push(r[0].slice(0,2)+":"+r[0].slice(2));p.push(+r[1]);const am=+r[3];a.push((am-pa)/1e8);pa=am});
 const est=a.reduce((s,v)=>v>1?s+v:s,0);const e12=ema(p,12),e26=ema(p,26),dif=p.map((v,k)=>e12[k]-e26[k]),dea=ema(dif,9),mac=dif.map((v,k)=>2*(v-dea[k]));
 document.getElementById("t"+i).innerHTML=n+" "+code.slice(2)+"<b>估算 "+est.toFixed(2)+"亿</b>";
 const ax=k=>({type:"category",data:t,gridIndex:k,axisLabel:{show:k==2,fontSize:10},axisTick:{show:false}});
 charts[i].setOption({backgroundColor:"transparent",animation:false,tooltip:{trigger:"axis"},axisPointer:{link:[{xAxisIndex:"all"}]},
  grid:[{top:8,height:"38%",left:44,right:8},{top:"46%",height:"24%",left:44,right:8},{top:"74%",height:"18%",left:44,right:8}],
  xAxis:[ax(0),ax(1),ax(2)],yAxis:[{scale:true,gridIndex:0,splitLine:{lineStyle:{color:"#2a2f3a"}},axisLabel:{fontSize:10}},{gridIndex:1,splitLine:{show:false},axisLabel:{fontSize:10,formatter:"{value}亿"}},{gridIndex:2,splitLine:{show:false},axisLabel:{fontSize:9}}],
  series:[{name:"价格",type:"line",data:p,showSymbol:false,lineStyle:{color:"#4d8dff",width:1.3}},
  {name:"成交额(亿)",type:"bar",xAxisIndex:1,yAxisIndex:1,data:a.map(v=>({value:+v.toFixed(3),itemStyle:{color:v>1?"#ff4d4f":"#6b7280"}})),markLine:{symbol:"none",silent:true,label:{show:false},lineStyle:{color:"#ff4d4f",type:"dashed"},data:[{yAxis:1}]}},
  {name:"MACD",type:"bar",xAxisIndex:2,yAxisIndex:2,data:mac.map(v=>({value:+v.toFixed(5),itemStyle:{color:v>=0?"#ff4d4f":"#26a65b"}}))},
  {name:"DIF",type:"line",xAxisIndex:2,yAxisIndex:2,data:dif.map(v=>+v.toFixed(5)),showSymbol:false,lineStyle:{color:"#f5a623",width:1}},
  {name:"DEA",type:"line",xAxisIndex:2,yAxisIndex:2,data:dea.map(v=>+v.toFixed(5)),showSymbol:false,lineStyle:{color:"#9b6bff",width:1}}]});
 return [d.date,est]}
async function sse(h){const k=(await j("https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get?param=sh000001,day,,,40,qfq")).data.sh000001;
 const rows=(k.day||k.qfqday).filter(r=>r[0]>="2026-10-15"),ds=rows.map(r=>r[0]);
 charts[7].setOption({backgroundColor:"transparent",animation:false,tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:10},itemWidth:10,itemHeight:8},grid:{top:48,left:46,right:44,bottom:28},
  xAxis:{type:"category",data:ds.map(s=>s.slice(5)),axisLabel:{fontSize:10}},yAxis:[{scale:true,splitLine:{lineStyle:{color:"#2a2f3a"}},axisLabel:{fontSize:10}},{name:"亿",splitLine:{show:false},axisLabel:{fontSize:10}}],
  series:[{name:"上证指数",type:"line",data:rows.map(r=>+r[2]),symbolSize:5,lineStyle:{color:"#e6e6e6"},itemStyle:{color:"#e6e6e6"},z:5}].concat(E.map((e,i)=>({name:e[0],type:"bar",stack:"r",yAxisIndex:1,itemStyle:{color:COL[i]},data:ds.map(d=>{const x=h[d];return x&&x[e[0]]!=null?+x[e[0]].toFixed(2):null})})))})}
let busy=false;async function refresh(){if(busy)return;busy=true;const rb=document.getElementById("rb");rb.disabled=true;rb.textContent="刷新中…";const st=document.getElementById("st");try{const r=await Promise.all(E.map((_,i)=>etf(i)));const day=r[0][0],ds=day.slice(0,4)+"-"+day.slice(4,6)+"-"+day.slice(6);
 const h=hist(),o={};E.forEach((e,i)=>o[e[0]]=r[i][1]);h[ds]=o;try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}
 const tot=r.reduce((s,x)=>s+x[1],0);document.getElementById("t7").innerHTML="上证指数 · 救市金额估算<b>今日 "+tot.toFixed(2)+"亿</b>";await sse(h);
 const d=bj();st.textContent="最后刷新 "+d.toLocaleString("zh-CN",{hour12:false})+"（北京时间）· "+(trading()?"交易中":"非交易时段")+" · 每60秒刷新"}catch(e){st.textContent="刷新失败："+e.message+"，60秒后重试"}finally{busy=false;rb.disabled=false;rb.textContent="手动刷新"}}
refresh();setInterval(refresh,60000);
</script></body></html>
